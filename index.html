async function syncSdk(){
  if (SYNC_RT.fb) return SYNC_RT.fb;
  var base = "https://www.gstatic.com/firebasejs/10.14.1/";
  var mods = await Promise.all([
    import(base + "firebase-app.js"),
    import(base + "firebase-auth.js"),
    import(base + "firebase-firestore.js")
  ]);
  SYNC_RT.fb = { app:mods[0], auth:mods[1], fs:mods[2] };
  return SYNC_RT.fb;
}

async function syncApp(config){
  var fb = await syncSdk();
  var cfg = config || (SYNC && SYNC.config);
  var cfgJson = JSON.stringify(cfg || {});
  if (!SYNC_RT.appInst || SYNC_RT.appCfg !== cfgJson) {
    SYNC_RT.appCount += 1;
    SYNC_RT.appInst = fb.app.initializeApp(cfg, "wardbook-" + SYNC_RT.appCount);
    SYNC_RT.appCfg = cfgJson;
  }
  return fb;
}

async function syncCurrentUser(fb){
  var authInst = fb.auth.getAuth(SYNC_RT.appInst);
  if (authInst.currentUser) return authInst.currentUser;
  await new Promise(function(resolve){
    var un = fb.auth.onAuthStateChanged(authInst, function(){
      un();
      resolve();
    });
  });
  return authInst.currentUser;
}

async function syncAesKey(){
  if (SYNC_RT.key) return SYNC_RT.key;
  SYNC_RT.key = await crypto.subtle.importKey("jwk", SYNC.keyJwk, { name:"AES-GCM" }, true, ["encrypt", "decrypt"]);
  return SYNC_RT.key;
}

function syncRefs(fb, uid){
  var db = fb.fs.getFirestore(SYNC_RT.appInst);
  return {
    casesCol: fb.fs.collection(db, "users", uid, "wb_cases"),
    caseDoc: function(id){ return fb.fs.doc(db, "users", uid, "wb_cases", id); },
    cryptoDoc: fb.fs.doc(db, "users", uid, "wb_meta", "crypto"),
    configDoc: fb.fs.doc(db, "users", uid, "wb_meta", "config"),
    outboxDoc: function(id){ return fb.fs.doc(db, "users", uid, "wb_outbox", id); }
  };
}

async function syncPullCases(fb, uid){
  var refs = syncRefs(fb, uid);
  var snap = await fb.fs.getDocs(refs.casesCol);
  var key = await syncAesKey();
  var out = [];
  for (var i = 0; i < snap.docs.length; i += 1) {
    var d = snap.docs[i];
    var v = d.data();
    if (v.deleted) { out.push({ id:d.id, deleted:true, case:null, mt:null, deletedAt:typeof v.deletedAt === "string" ? v.deletedAt : null }); continue; }
    try {
      var payload = await syncDecryptJson(key, v.blob, v.iv);
      out.push({ id:d.id, deleted:false, case:payload.case, mt:payload.mt || {} });
    } catch (e) {
      // One corrupt/undecryptable doc must not brick sync for everything else.
      // Skipped docs stay untouched on the server; a local dirty copy repairs
      // them on the next push.
      if (typeof console !== "undefined" && console.warn) console.warn("wardbook sync: skip doc " + d.id, e);
    }
  }
  return out;
}

async function syncPullConfig(fb, uid){
  var refs = syncRefs(fb, uid);
  var snap = await fb.fs.getDoc(refs.configDoc);
  if (!snap.exists()) return null;
  var v = snap.data();
  var key = await syncAesKey();
  return await syncDecryptJson(key, v.blob, v.iv);
}

async function syncPushCases(fb, uid, pushes){
  var refs = syncRefs(fb, uid);
  var key = await syncAesKey();
  for (var i = 0; i < pushes.length; i += 1) {
    var p = pushes[i];
    if (p.deleted) {
      // deletedAt is a plain timestamp (no clinical content) - same class of
      // metadata as updatedAt, needed for delete-vs-edit resolution.
      await fb.fs.setDoc(refs.caseDoc(p.id), { v:1, deleted:true, deletedAt:p.deletedAt || null, updatedAt:fb.fs.serverTimestamp() });
    } else {
      var enc = await syncEncryptJson(key, { case:p.case, mt:p.mt });
      await fb.fs.setDoc(refs.caseDoc(p.id), { v:1, deleted:false, iv:enc.iv, blob:enc.blob, updatedAt:fb.fs.serverTimestamp() });
    }
  }
}

async function syncPushConfig(fb, uid){
  var refs = syncRefs(fb, uid);
  var key = await syncAesKey();
  var plain = syncConfigPlain(DB);
  var enc = await syncEncryptJson(key, plain);
  await fb.fs.setDoc(refs.configDoc, { v:1, iv:enc.iv, blob:enc.blob, updatedAt:fb.fs.serverTimestamp() });
}

function queueSync(){
  if (!SYNC || !SYNC.enabled) return;
  clearTimeout(SYNC_PUSH_TIMER);
  SYNC_PUSH_TIMER = setTimeout(function(){ syncNow(); }, 5000);
}

async function syncSendOutboxIfNeeded(source){
  if (!SYNC || !SYNC.enabled) return false;
  var payload = buildOutboxBatch(DB.cases, todayISO(), uid(), STATS);
  if (!payload.seeds.length) return false;
  if (OUTBOX_SENDING) return false;
  OUTBOX_SENDING = true;
  try {
    var fb = await syncApp();
    var user = await syncCurrentUser(fb);
    if (!user) {
      setSyncStatus("reauth");
      return false;
    }
    var refs = syncRefs(fb, user.uid);
    var key = await syncAesKey();
    var enc = await syncEncryptJson(key, payload);
    await fb.fs.setDoc(refs.outboxDoc(payload.batchId), {
      v:1,
      iv:enc.iv,
      blob:enc.blob,
      consumed:false,
      createdAt:fb.fs.serverTimestamp()
    });
    var sentIso = nowISO();
    DB.cases = DB.cases.map(function(c){
      var touched = false;
      var nextSeeds = c.seeds.map(function(seed){
        if (seed.sentAt != null) return seed;
        var found = payload.seeds.some(function(row){ return row.caseId === c.id && row.seedId === seed.id; });
        if (!found) return seed;
        touched = true;
        return Object.assign({}, seed, { sentAt:sentIso });
      });
      if (!touched) return c;
      var updated = Object.assign({}, c, { seeds:nextSeeds, lastTouchedAt:c.lastTouchedAt });
      // sentAt is a mirror edit outside mutateCase: absorb it into entries so
      // the stamp survives the next normalize and syncs element-wise.
      entriesReconcileLocal(updated, sentIso, todayISO());
      return updated;
    });
    saveState();
    syncAfterSave();
    return true;
  } catch (e) {
    return false;
  } finally {
    OUTBOX_SENDING = false;
  }
}

async function syncNow(opts){
  opts = opts || {};
  if (!SYNC || !SYNC.enabled) return;
  if (SYNC_RUNNING) {
    SYNC_PENDING = true;
    return;
  }
  SYNC_RUNNING = true;
  setSyncStatus("syncing");
  try {
    var fb = await syncApp();
    var user = await syncCurrentUser(fb);
    if (!user) {
      setSyncStatus("reauth");
      return;
    }
    var remoteCases = await syncPullCases(fb, user.uid);
    var remoteConfig = await syncPullConfig(fb, user.uid);
    // Config merges FIRST: case reconcile ends in normalizeState, whose
    // stage-exists fallback would clobber assignments to a stage that arrives
    // in this very sync from the other device.
    var cfgRes = syncReconcileConfig(DB, SYNC.state, remoteConfig, nowISO());
    var res = syncReconcile(cfgRes.data, SYNC.state, remoteCases, nowISO());
    DB = normalizeState(res.data);
    DB._configMt = JSON.parse(JSON.stringify((SYNC.state && SYNC.state.configMt) || {}));
    if (res.localChanged || cfgRes.localChanged) {
      saveState();
      render();
    }
    if (res.pushes.length) {
      await syncPushCases(fb, user.uid, res.pushes);
      syncClearDirty(SYNC.state, res.pushes.map(function(p){ return p.id; }));
    }
    if (cfgRes.push) {
      await syncPushConfig(fb, user.uid);
      syncClearConfigDirty(SYNC.state);
    }
    SYNC.lastSyncAt = nowISO();
    saveSync();
    setSyncStatus("ok");
    // Legacy seeds are sent only at boot (SPEC-C section 2; the review screen
    // that also triggered sends was removed 2026-07-25). Not on every sync.
  } catch (e) {
    saveSync();
    var msg = String((e && e.message) || e);
    var offline = (typeof navigator !== "undefined" && navigator.onLine === false) || /network|failed to fetch|imported/i.test(msg);
    if (!offline && typeof console !== "undefined" && console.warn) console.warn("wardbook sync error:", e);
    setSyncStatus(offline ? "offline" : "error");
  } finally {
    SYNC_RUNNING = false;
    if (SYNC_PENDING) {
      SYNC_PENDING = false;
      queueSync();
    }
  }
}

function syncAfterSave(){
  if (!SYNC || !SYNC.enabled) return;
  syncNoteLocalChanges(DB, SYNC.state, nowISO());
  saveSync();
  queueSync();
}

function parseFirebaseConfig(text){
  var keys = ["apiKey", "authDomain", "projectId", "storageBucket", "messagingSenderId", "appId"];
  var cfg = {};
  keys.forEach(function(k){
    var m = String(text || "").match(new RegExp(k + '["\\\']?\\s*[:=]\\s*["\\\']([^"\\\']+)["\\\']'));
    if (m) cfg[k] = m[1];
  });
  if (!cfg.apiKey || !cfg.projectId || !cfg.appId) return null;
  if (!cfg.authDomain) cfg.authDomain = cfg.projectId + ".firebaseapp.com";
  return cfg;
}

async function enableSync(cfg, email, password, passphrase){
  var fb = await syncApp(cfg);
  var authInst = fb.auth.getAuth(SYNC_RT.appInst);
  var cred;
  try {
    cred = await fb.auth.signInWithEmailAndPassword(authInst, email, password);
  } catch (e) {
    var code = e && e.code;
    if (code === "auth/user-not-found" || code === "auth/invalid-credential" || code === "auth/invalid-login-credentials") {
      cred = await fb.auth.createUserWithEmailAndPassword(authInst, email, password);
    } else {
      throw e;
    }
  }
  var uidValue = cred.user.uid;
  var refs = syncRefs(fb, uidValue);
  var metaSnap = await fb.fs.getDoc(refs.cryptoDoc);
  var salt;
  var iter;
  var key;
  if (metaSnap.exists()) {
    var meta = metaSnap.data();
    salt = meta.salt;
    iter = meta.iter || PBKDF2_ITER;
    key = await syncDeriveKey(passphrase, salt, iter);
    await syncDecryptJson(key, meta.check.blob, meta.check.iv);
  } else {
    salt = syncRandomSaltB64();
    iter = PBKDF2_ITER;
    key = await syncDeriveKey(passphrase, salt, iter);
    var check = await syncEncryptJson(key, { check:"wardbook" });
    await fb.fs.setDoc(refs.cryptoDoc, { v:1, salt:salt, iter:iter, check:check });
  }
  SYNC_RT.key = key;
  SYNC = {
    enabled:true,
    config:cfg,
    email:email,
    uid:uidValue,
    salt:salt,
    iter:iter,
    keyJwk:await crypto.subtle.exportKey("jwk", key),
    state:syncEmptyState(),
    lastSyncAt:null
  };
  saveSync();
  setSyncStatus("idle");
  await syncNow();
}

async function doEnableSync(){
  var cfg = parseFirebaseConfig((SHEET.draft && SHEET.draft.firebaseConfig) || "");

}

function weekDefaultFuture(){

}

// The week grid reads best in landscape (wide date span). Lock to landscape
// while it is on screen and release otherwise, where the platform supports it
// (installed PWA on Android). Everywhere else this is a harmless no-op — the
// manifest keeps the app rotatable so portrait board/review/detail are
// unaffected. Called from render(); only acts when the desired state flips.
function syncOrientationLock(){
  var wantLandscape = VIEW.name === "board" && VIEW.boardMode === "week";
  if (wantLandscape === LAST_ORIENT_WEEK) return;
  LAST_ORIENT_WEEK = wantLandscape;
  try {
    var so = (typeof screen !== "undefined") ? screen.orientation : null;
    if (!so) return;
    if (wantLandscape && so.lock) {
      var p = so.lock("landscape");
      if (p && p.catch) p.catch(function(){});
    } else if (so.unlock) {
      so.unlock();
    }
  } catch (e) {}
}

// What each tab needs done when you arrive on it. A tab with nothing to set up
// simply has no entry here.
var TAB_ENTER = {
  calc:function(prev){
    if (prev === "calc") return;
    // Arriving on the calculator always starts from empty: the moment's state
    // (SpO2, blood pressure, consciousness) must never be inherited from the
    // last time the tab was used.
    CALC_SCRATCH = {};

    VIEW.calcTool = calcOnlyToolId();
  }
};

function shiftDayDate(delta){
  var base = Date.parse((VIEW.dayDate || todayISO()) + "T00:00:00");
  if (!Number.isFinite(base)) base = Date.parse(todayISO() + "T00:00:00");
  var d = new Date(base + (Number(delta) || 0) * 86400000);
  VIEW.dayDate = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  render();
}

function ensureWeekWrapBehavior(){
  if (VIEW.name !== "board" || VIEW.boardMode !== "week" || !document || !document.getElementById) return;
  var wrap = document.getElementById("weekWrap");
  if (!wrap) return;
  wrap.onscroll = function(){
    if (WEEK_SCROLL_RT.busy) return;
    var left = Number(wrap.scrollLeft) || 0;
    var width = Number(wrap.scrollWidth) || 0;
    var view = Number(wrap.clientWidth) || 0;
    WEEK_SCROLL_RT.lastLeft = left;
    if (width <= view) return;
    if (left <= 80) {
      WEEK_SCROLL_RT.busy = true;
      WEEK_SCROLL_RT.pendingLeftAdjust = width;
      VIEW.weekPast = (Number(VIEW.weekPast) || 0) + 7;
      render();
      return;
    }
    if (width - (left + view) <= 80) {
      WEEK_SCROLL_RT.busy = true;
      VIEW.weekFuture = (Number(VIEW.weekFuture) || 0) + 7;
      render();
    }
  };
  if (WEEK_SCROLL_RT.pendingLeftAdjust) {
    var prevWidth = WEEK_SCROLL_RT.pendingLeftAdjust;
    var nextWidth = Number(wrap.scrollWidth) || 0;
    wrap.scrollLeft = (Number(wrap.scrollLeft) || 0) + Math.max(0, nextWidth - prevWidth);
    WEEK_SCROLL_RT.lastLeft = Number(wrap.scrollLeft) || 0;
    WEEK_SCROLL_RT.pendingLeftAdjust = 0;
    WEEK_SCROLL_RT.busy = false;
  } else if (WEEK_SCROLL_RT.initPending) {
    var totalCols = (Number(VIEW.weekPast) || 0) + (Number(VIEW.weekFuture) || 0) + 1;
    var totalWidth = Number(wrap.scrollWidth) || 0;
    if (totalCols > 0 && totalWidth > 0) {
      var colWidth = totalWidth / totalCols;
      wrap.scrollLeft = Math.max(0, Math.round(colWidth * (Number(VIEW.weekPast) || 0)));
    }
    WEEK_SCROLL_RT.lastLeft = Number(wrap.scrollLeft) || 0;
    WEEK_SCROLL_RT.initPending = false;
  } else {
    // Plain data re-render (cell edit, sync merge): innerHTML replacement reset
    // the scroll position - restore where the user was, or the grid snaps back
    // to the far past and immediately triggers another past-extension.
    if (WEEK_SCROLL_RT.lastLeft) wrap.scrollLeft = WEEK_SCROLL_RT.lastLeft;
    WEEK_SCROLL_RT.busy = false;
  }
}

function updateCaseAdmittedAt(caseId, value){
  var date = /^\d{4}-\d{2}-\d{2}$/.test(String(value || "")) ? String(value) : todayISO();
  mutateCase(caseId, function(c){
    c.admittedAt = date;
    // Clamp EVERY earlier log row, not just the first: a lone clamped head row
    // would sort behind later stage changes and silently rewrite the current
    // stage at the next normalize.
    var rows = cloneArr(c.stageLog).map(function(row){
      return row && row.date < date ? { date:date, stageId:row.stageId } : row;
    });
    c.stageLog = normalizeStageLog(rows, c.admittedAt, c.stageId);
  });
}

function queueFocusTarget(id, shouldSelect){
  PENDING_FOCUS = { id:id, select:!!shouldSelect };

function flushQueuedFocus(){
  if (!PENDING_FOCUS || !document || !document.getElementById) return;
  var next = PENDING_FOCUS;
  PENDING_FOCUS = null;
  var el = document.getElementById(next.id);
  if (!el) return;
  if (el.focus) el.focus();
  if (next.select && el.select) el.select();
}

function persist(){
  saveState();
  render();
  syncAfterSave();
}

function applyDailyRollover(force){
  var today = todayISO();
  var changed = !!force;
  DB.cases.forEach(function(c){
    var nextTodos = rolloverTodos(c, today);
    if (JSON.stringify(nextTodos) !== JSON.stringify(c.todos)) {
      // The mirror edit MUST be absorbed into entries: mirrors are rebuilt from
      // entries on every normalize/merge, so a bare todos write resurrects the
      // rolled-off items at the next sync (and never propagates the cleanup).
      c.todos = nextTodos;
      entriesReconcileLocal(c, nowISO(), today);
      changed = true;
    }
  });
  VIEW.nowDay = today;
  if (changed) {
    saveState();
    syncAfterSave();
  }
}

function ensureToday(){
  if (VIEW.nowDay !== todayISO()) {
    ensureStatsBootDay();

function mutateCase(caseId, fn){
  var target = DB.cases.find(function(c){ return c.id === caseId; });
  if (!target) return;
  fn(target);
  touch(target);
  target.todos = rolloverTodos(target, todayISO());
  // Absorb the mirror edits into the entries store (SPEC-F) so element-level
  // timestamps exist before this change is pushed by the sync engine.
  entriesReconcileLocal(target, nowISO(), todayISO());
  persist();
}

function reorderActiveByIds(ids){
  var set = new Set(ids);
  var sorted = ids.map(function(id){ return DB.cases.find(function(c){ return c.id === id; }); }).filter(Boolean);
  var idx = 0;
  DB.cases = DB.cases.map(function(c){
    if (c.status !== "active" || !set.has(c.id)) return c;
    var next = sorted[idx++];
    var copy = Object.assign({}, next);
    copy.order = idx - 1;
    return copy;
  });
}

// Android back-button support. Every deepening step (board -> search/detail,
// or opening a bottom sheet) pushes one history entry plus a restore snapshot on
// NAV.stack. popstate pops the snapshot and restores it. UI-initiated closes must
// consume their history entry too (NAV.ignore skips the resulting popstate), or
// stale entries would leave "dead" back presses.
function navPush(entry){
  NAV.stack.push(entry);
  try { history.pushState({ wb:NAV.stack.length }, ""); } catch (e) {}
}

function navSnapshotView(){
  return { kind:"view", view:JSON.parse(JSON.stringify(VIEW)) };
}

function navNoteSheetOpen(){
  if (!SHEET.name) navPush({ kind:"sheet" });
}

function navUnwindAll(){
  var n = NAV.stack.length;
  if (!n) return;
  NAV.stack = [];
  NAV.ignore += 1;
  try { history.go(-n); } catch (e) {}
}

function handlePopState(ev){
  if (NAV.ignore > 0) {
    NAV.ignore -= 1;
    return;
  }
  var target = ev && ev.state && Number(ev.state.wb);
  if (!Number.isFinite(target) || target < 0) target = 0;
  var entry = null;
  while (NAV.stack.length > target) entry = NAV.stack.pop();
  if (!entry) return;
  if (entry.kind === "sheet") {
    SHEET.name = "";
    SHEET.draft = {};
    renderSheet();
    return;
  }
  SHEET.name = "";
  SHEET.draft = {};
  VIEW = entry.view;
  if (VIEW.name === "board" && VIEW.boardMode === "week") WEEK_SCROLL_RT.initPending = true;
  render();
}

function downloadBackup(){
  var today = todayISO();
  var payload = JSON.stringify(normalizeState(DB), null, 2);
  if (typeof Blob === "undefined" || typeof URL === "undefined" || !URL.createObjectURL) return;
  var blob = new Blob([payload], { type:"application/json;charset=utf-8" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "wardbook-backup-" + today + ".json";
  if (a.click) a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 0);
}

  if (el && el.click) el.click();

function restoreBackupFile(input){
  var file = input && input.files && input.files[0];
  if (!file || typeof FileReader === "undefined") return;
  var reader = new FileReader();
  reader.onload = function(){
    try {
      var parsed = JSON.parse(String(reader.result || "null"));
      if (typeof confirm === "function" && !confirm(STR.restoreConfirm)) return;
      DB = normalizeState(parsed);
      // Design session 2026-07-09 decision 1: restore recovers THIS device only.
      // Resetting the sync state makes the next sync a baseline (newer server
      // data wins back; cases missing from the backup return from the server),
      // and the restored flags keep these cases alive against remote tombstones.
      if (SYNC && SYNC.enabled) {
        SYNC.state = syncEmptyState();
        DB.cases.forEach(function(c){ syncMarkRestored(SYNC.state, c.id); });
        saveSync();
      }
      saveState();
      render();
      closeSheet();
      syncAfterSave();
    } catch (e) {}
  };
  reader.readAsText(file, "utf-8");
}

// Calculator inputs persist on the case so the next round only needs the new
// Cr. Bound to onchange (not oninput): mutateCase re-renders, and a re-render
// per keystroke would steal focus mid-number.
// undefined = "leave the stored value alone" (garbage typed into a number box
// must not silently blank a value the user entered earlier).
function calcFieldValue(def, value){
  var raw = String(value == null ? "" : value).trim();
  if (def.type === "date" || def.type === "sex") return raw;
  if (def.type === "bool") return value === true || raw === "true";
  // Three states on purpose: "" (not assessed) is not the same as "no". A score
  // must refuse to compute from an unanswered item rather than assume normal.
  if (def.type === "bool3") return raw === "true" ? true : raw === "false" ? false : "";
  // Ordered grades (Child-Pugh's encephalopathy / ascites). Same three-state
  // rule as bool3: "" means not assessed, and a score must refuse to compute.
  if (def.type === "grade") {
    var g = Math.round(Number(raw));
    return (isFinite(g) && g >= 1 && g <= (def.choices || []).length) ? g : "";
  }
  if (!raw) return null;
  var n = Number(raw);
  if (!isFinite(n) || n < 0) return undefined;
  return def.type === "int" ? Math.round(n) : n;
}

// The allowlist is CALC_FIELDS itself, so a new field is declared in exactly
// one place and can never reach storage without a declared type and bounds.
function updateCaseBio(caseId, key, value){
  var def = Object.prototype.hasOwnProperty.call(CALC_FIELDS, key) ? CALC_FIELDS[key] : null;
  if (!def) return;
  if (def.type === "sex") { if (caseId) updateCaseSex(caseId, String(value == null ? "" : value)); else { CALC_SCRATCH.sex = String(value == null ? "" : value); calcRerender(); } return; }
  var next = calcFieldValue(def, value);
  if (next === undefined) return;
  // store:"none" never reaches a case, even when one is open.
  if (!caseId || def.store === "none") { CALC_SCRATCH[key] = next; calcRerender(); return; }
  mutateCase(caseId, function(c){
    if (!isObj(c.bio)) c.bio = {};
    c.bio[key] = next;
  });
}

// The calculator result on screen, as the one-line record text — or "" when
// there is nothing to record (no case, no tool, no computable result).
function calcResultText(caseId, toolId){
  var tool = calcToolById(toolId);
  if (!tool || !caseId) return "";
  var values = calcValuesFor(caseId);
  if (values === null) return "";
  var parts = calcCollect(tool, values).filter(function(r){ return r.value !== null; }).map(function(r){
    var band = r.bandKey && STR[r.bandKey] ? " " + STR[r.bandKey] : "";
    return STR[r.labelKey] + " " + r.value + " " + STR[r.unitKey] + band;
  });
  if (!parts.length) return "";
  return STR[tool.nameKey] + "：" + parts.join(" / ");
}

// Dated record of a calculation (kind:"calc", E2E-encrypted sync like AI logs).
// It carries the day it was computed, so a saved score is a snapshot and not a
// stale-looking live value. Never fed to aiFeedbackPayload — the AI boundary
// stays admission text + notes (CEO 2026-07-21).
//
// 2026-07-31: the "この計算を記録に残す" button is gone. Scoring a patient is
// itself the record, and a button you must remember to press is exactly the
// kind of extra step that never survives a ward round. Saving now happens when
// you leave the tool. Re-opening the same score on the same day with the same
// numbers does NOT stack a duplicate; different numbers DO record separately,
// because a score that moved during the day is the interesting part.
function autoSaveCalcResult(caseId, toolId){
  var text = calcResultText(caseId, toolId);
  if (!text) return false;
  var today = todayISO();
  var c = DB.cases.find(function(x){ return x.id === caseId; });
  if (!c) return false;
  var dup = cloneArr(c.calcLogs).some(function(x){ return x && x.date === today && x.text === text; });
  if (dup) return false;
  return addListItem("calcLogs", caseId, text, null, function(t){ return { id:uid(), text:t, date:today }; });
}

// Called on every exit from an open tool (close, back to list, switch tool).
function flushCalcAutoSave(){
  if (!VIEW.calcFor || !VIEW.calcTool) return;

// Cell-tap add: fixed kinds (task / pending) plus the user's chart
// categories listed dynamically (SPEC-F decision 4 - adding a category in
// settings extends this menu automatically, nothing is hardcoded).
function addCellItem(caseId, date){
  var itemType = SHEET.draft && SHEET.draft.itemType || "todo";
  var text = String(SHEET.draft && SHEET.draft.text || "").trim();
  if (!text) return;
  mutateCase(caseId, function(c){
    if (itemType === "pending") c.pendings.push(makePending(text, date));
    else if (itemType === "todo") c.todos.push(makeTodo(text, date, null));
    else if (itemType.indexOf("cat:") === 0) {
      var cat = chartCatById(itemType.slice(4));
      if (!cat) return;
      c.chart = normalizeChart(c.chart);
      if (cat.kind === "event") {
        c.chart.items.push({ id:uid(), catId:cat.id, kind:"event", name:text, date:date, status:"planned" });
      } else if (cat.kind === "value") {
        // Same-named row is reused so "echo planned twice" stays one chart row.
        var item = c.chart.items.find(function(row){ return row.catId === cat.id && row.kind === "value" && row.name === text; });
        if (!item) {
          item = { id:uid(), catId:cat.id, kind:"value", name:text, values:{}, planned:{} };

// ---- shared config-list editing (stages / chartCats) -----------------------
function swapAt(list, index, direction){
  var target = direction === "up" ? index - 1 : index + 1;
  if (index < 0 || target < 0 || target >= list.length) return false;
  var picked = list[index];
  list[index] = list[target];
  list[target] = picked;
  return true;
}

function configRename(key, index, value){
  var list = DB.config[key];
  if (!list[index]) return;
  list[index].name = String(value || "").trim() || list[index].name;
  configChanged();
}

function configSetColor(key, index, color){
  var list = DB.config[key];
  if (!list[index]) return;
  list[index].color = color;
  configChanged();
}

function configMove(key, index, direction){
  var next = cloneArr(DB.config[key]);
  if (!swapAt(next, index, direction)) return;
  DB.config[key] = next;
  configChanged();
}

function configDelete(key, index, useCount){
  var list = DB.config[key];
  if (!list[index] || list.length <= 1) return;
  if (useCount) {
    if (typeof alert === "function") alert(STR.stageInUse + " " + useCount);
    return;
  }
  list.splice(index, 1);
  configChanged();
}

// Export-text section: "## title", then one line per item (fmt may return an
// array of lines), "- -" when empty.
function pushSection(lines, title, list, fmt){
  lines.push("", "## " + title);
  if (!list.length) { lines.push("- -"); return; }
  list.forEach(function(item){
    var rows = fmt(item);
    (Array.isArray(rows) ? rows : [rows]).forEach(function(row){ lines.push(row); });
  });
}

function fmtTaskLine(item){
  var when = [item.due, item.time].filter(Boolean).join(" ");
  return "- " + item.text + (when ? " (" + when + ")" : "") + (item.done ? " [done]" : "");
}
function fmtPendingLine(item){ return "- " + item.text + (item.backOn ? " (" + item.backOn + ")" : "") + (item.closedOn ? " [closed " + item.closedOn + "]" : ""); }
// The course, flattened for the export: one line per footprint under its day.
// This is the section that makes a discharged case readable months later, so it
// carries the same rows the panel draws — no summarising, no interpretation.
function fmtCourseLine(row){ return "- D" + row.day + " " + row.date + " [" + row.label + "] " + row.text; }
function fmtNoteLine(item){ return "- " + item.date + " " + item.text; }
function fmtCalcLine(item){ return "- " + item.date + " " + item.text; }

// Exports read notes oldest-first (chronological narrative for AI feedback).
function notesChrono(c){
  return cloneArr(c.notes).sort(function(a, b){
    if (a.date !== b.date) return a.date < b.date ? -1 : 1;
    return a.id < b.id ? -1 : 1;
  });
}

function calcLogsChrono(c){
  return cloneArr(c.calcLogs).sort(function(a, b){
    if (a.date !== b.date) return a.date < b.date ? -1 : 1;
    return a.id < b.id ? -1 : 1;
  });
}

// 2026-07-21): only the admission text and dated note bodies ever leave the
// device. Label, ward/room, age band, sex and every other case field must
// never be added here.
function aiFeedbackPayload(c){
  return {
    adm: admOf(c).text || "",
    notes: notesChrono(c).map(function(n){ return { date:n.date, text:n.text }; })
  };
}

function dischargeExportText(caseId){
  var c = DB.cases.find(function(item){ return item.id === caseId; });
  if (!c) return "";
  var dayNow = c.dischargedAt || todayISO();
  var lines = [
    "# " + c.label,
    "",
    "- Dx: " + (c.dxTags.length ? c.dxTags.join(", ") : "-"),
    "- Meta: " + (compactMeta(c) || "-"),
    "- Stay: " + c.admittedAt + " D1-D" + computeDay(c.admittedAt, dayNow),
    "",
    "## Stage history"
  ];
  cloneArr(c.stageLog).forEach(function(item){
    lines.push("- " + item.date + " " + stageNameFor(item.stageId));
  });
  lines.push("", "## Phase", c.phaseNote || "-");
  lines.push("", "## Admission note", admOf(c).text || "-");
  pushSection(lines, "Course", courseRows(c, stageNameFor).map(function(row){
    return { day:computeDay(c.admittedAt, row.date), date:row.date, label:courseLabel(row.kind), text:row.text };
  }), fmtCourseLine);
  pushSection(lines, "Daily notes", notesChrono(c), fmtNoteLine);
  pushSection(lines, "Calculations", calcLogsChrono(c), fmtCalcLine);
  pushSection(lines, "Remaining Task", cloneArr(c.todos).filter(function(item){ return item && !item.done; }), fmtTaskLine);
  pushSection(lines, "Pending", cloneArr(c.pendings), fmtPendingLine);
  return lines.join("\n");
}

// Drag & drop: no re-render between pointerdown and pointerup. Re-rendering
// mid-gesture destroys the captured element, which kills the pointer stream on
// touch devices (the original bug). Hit-testing runs on document-level
// pointermove against the always-present dropzones instead.
function startDragCase(ev, caseId){
  if (!ev) return;
  if (ev.stopPropagation) ev.stopPropagation();
  if (ev.preventDefault) ev.preventDefault();
  if (ev.pointerId != null && ev.target && ev.target.setPointerCapture) {
    try { ev.target.setPointerCapture(ev.pointerId); } catch (e) {}
  }
  DND.activeId = caseId;
  DND.hoverIndex = -1;
  var card = ev.target && ev.target.closest ? ev.target.closest(".card") : null;
  if (card && card.classList) card.classList.add("dragging");
}

function nearestDropIndex(clientY){
  if (!document.querySelectorAll) return -1;
  var zones = document.querySelectorAll(".dropzone");
  var best = -1;
  var bestDist = Infinity;
  for (var i = 0; i < zones.length; i += 1) {
    var rect = zones[i].getBoundingClientRect();
    var dist = Math.abs(rect.top + rect.height / 2 - clientY);
    if (dist < bestDist) { bestDist = dist; best = i; }
  }
  return best;
}

function dragMove(ev){
  if (!DND.activeId) return;
  if (ev && ev.preventDefault) ev.preventDefault();
  var idx = nearestDropIndex(ev.clientY);
  if (idx === DND.hoverIndex) return;
  DND.hoverIndex = idx;
  var zones = document.querySelectorAll(".dropzone");
  for (var i = 0; i < zones.length; i += 1) {
    if (zones[i].classList) zones[i].classList.toggle("on", i === idx);
  }
}

function dragEnd(){
  if (!DND.activeId) return;
  if (DND.hoverIndex >= 0) dropReorder(DND.hoverIndex);
  else cancelDrag();
}

function dropReorder(index){
  if (!DND.activeId) return;
  var ids = boardCases().map(function(c){ return c.id; });
  var from = ids.indexOf(DND.activeId);
  if (from < 0) {
    DND.activeId = "";
    DND.hoverIndex = -1;
    render();
    return;
  }
  var nextIds = ids.slice();
  var picked = nextIds.splice(from, 1)[0];
  var target = index;
  if (target > from) target -= 1;
  if (target < 0) target = 0;
  if (target > nextIds.length) target = nextIds.length;
  nextIds.splice(target, 0, picked);
  reorderActiveByIds(nextIds);
  DND.activeId = "";
  DND.hoverIndex = -1;
  saveState();
  render();
  syncAfterSave();
}

function cancelDrag(){
  if (!DND.activeId && DND.hoverIndex < 0) return;
  DND.activeId = "";
  DND.hoverIndex = -1;
  render();
}

// Card task order: actionable-today first (timed ones in clock order), then
// future-scheduled ones (faint, sorted by date) so a dated task never
// silently disappears from the case card.
function boardCardTasks(c){
  var today = todayISO();
  var undone = cloneArr(c.todos).filter(function(x){ return x && !x.done; });
  var now = undone.filter(function(x){ return x.due ? x.due <= today : x.createdOn <= today; });
  var timed = now.filter(function(x){ return x.time; }).sort(function(a, b){ return a.time < b.time ? -1 : a.time > b.time ? 1 : 0; });
  var later = undone.filter(function(x){ return now.indexOf(x) < 0; }).sort(function(a, b){ return String(a.due || "") < String(b.due || "") ? -1 : 1; });
  return { now:timed.concat(now.filter(function(x){ return !x.time; })), later:later };
}

// One quiet metadata row per kind: the label is printed once and every value of
// that kind stacks to its right (values arrive pre-escaped, because 待ち mixes
// plain text with the highlighted 今日戻り span).
function quietRow(label, values){
  if (!values.length) return '';
  return '<div class="qrow"><span class="k">' + esc(label || "") + '</span><span class="qv">' + values.map(function(v){
    return '<span class="ql">' + v + '</span>';
  }).join('') + '</span></div>';
}

function renderBoardCard(c){
  var today = todayISO();
  var stage = stageById(c.stageId);
  var tasks = boardCardTasks(c);
  var visible = cardSectionsVisible();
  var stale = stalenessLevel(c.lastTouchedAt, nowISO());
  var staleClass = stale === 2 ? ' stale2' : stale === 1 ? ' stale1' : '';
  // 案B: today's tasks are the subject of the card — the only large type, no
  // section title above them (the checkboxes say what they are).
  var taskHtml = visible.indexOf("task") >= 0 ? tasks.now.map(function(item){
    return '<label class="btask" onclick="event.stopPropagation()"><input class="check" type="checkbox" ' + (item.done ? 'checked ' : '') + 'onclick="toggleTodo(\'' + esc(c.id) + '\',\'' + esc(item.id) + '\')"><span class="btasktext">' + esc(item.text) + (item.time ? '<span class="btime">' + esc(item.time) + '</span>' : '') + '</span></label>';
  }).join('') : '';
  // Everything else becomes quiet metadata. Show/hide and the up-down order from
  // 設定 still apply — only the weight changed, so no settings migration.
  var quietRows = {
    phase:c.phaseNote ? quietRow(DB.config.labels.phase, [esc(c.phaseNote)]) : '',
    task:quietRow(DB.config.labels.task, tasks.later.map(function(item){
      var when = (item.due ? item.due.slice(5) : '') + (item.time ? ' ' + item.time : '');
      return (when ? esc(when) + '　' : '') + esc(item.text);
    })),
    pending:quietRow(DB.config.labels.pending, openPendings(c).map(function(item){
      var urgent = item.backOn && item.backOn <= today;
      var tail = urgent ? '<span class="hot">' + esc(STR.backTodayBadge) + '</span>' : (item.backOn ? esc(item.backOn.slice(5)) : '');
      return esc(item.text) + (tail ? '　' + tail : '');
    }))
  };
  var quiet = visible.map(function(name){ return quietRows[name] || ""; }).join('');
  return '<article class="card bcard' + staleClass + (DND.activeId === c.id ? ' dragging' : '') + '" style="border-left-color:' + esc(stage.color) + '" onclick="openDetail(\'' + esc(c.id) + '\')">' +
    '<div class="bhead">' +
      '<button class="handle" onpointerdown="startDragCase(event,\'' + esc(c.id) + '\')" onclick="event.stopPropagation()">≡</button>' +
      '<span class="bid">' + esc(c.label || '—') + ' D' + computeDay(c.admittedAt, today) + '</span>' +
      (compactMeta(c) ? '<span class="bmeta">' + esc(compactMeta(c)) + '</span>' : '') +
      '<span class="bstage">' + stageDot(stage) + esc(stage.name) + '</span>' + aiCardBadge(c) +
      // The entire push half of the nudge design: one small mark. No count, no
      // colour alarm, no notification — open the patient when you feel like it.
      (caseNudge(c) ? '<span class="nudgedot" title="' + esc(STR.coursePanel) + '">' + esc(STR.nudgeBadge) + '</span>' : '') +
    '</div>' +
    (c.dxTags.length ? '<div class="bdx">' + esc(c.dxTags.join('・')) + '</div>' : '') +
    taskHtml +
    (quiet ? '<div class="bquiet">' + quiet + '</div>' : '') +
  '</article>';
}

function renderDayPlanView(){
  var today = todayISO();
  var date = /^\d{4}-\d{2}-\d{2}$/.test(String(VIEW.dayDate || "")) ? VIEW.dayDate : today;
  var groups = buildDayPlan(DB.cases, date, today);
  var nav = '<div class="daynav"><button class="iconbtn" onclick="shiftDayDate(-1)">◀</button><div class="daynavdate">' + esc(weekHeaderLabel(date)) + (date === today ? ' <span class="badge">' + esc(STR.dayView) + '</span>' : '') + '</div><button class="iconbtn" onclick="shiftDayDate(1)">▶</button>' + (date !== today ? '<button class="smallbtn" onclick="openDayView(\'' + esc(today) + '\')">' + esc(STR.dayToToday) + '</button>' : '') + '</div>';
  var bodyHtml = groups.length ? groups.map(function(g){
    var stage = stageById(g.stageId);
    var overdueItems = g.items.filter(function(item){ return item.type === "overdue"; });
    var normalItems = g.items.filter(function(item){ return item.type !== "overdue"; });
    // MAR block: unresolved past plans stay pinned in red until an explicit
    // done / move-date / cancel — never auto-carried, never auto-dropped.
    var overdueHtml = overdueItems.length ? '<div class="overdueblock"><div class="fieldlabel">⚠ ' + esc(STR.overdueTitle) + '</div>' + overdueItems.map(function(item){
      var resolve = item.kind === "valuePlan"
        ? '<button class="smallbtn" onclick="event.stopPropagation();openChartValue(\'' + esc(g.caseId) + '\',\'' + esc(item.id) + '\',\'' + esc(item.date) + '\')">' + esc(STR.markDone) + '</button>' +
          '<input class="date" type="date" value="' + esc(item.date) + '" onclick="event.stopPropagation()" onchange="rescheduleChartEntry(\'' + esc(g.caseId) + '\',\'' + esc(item.id) + '\',\'' + esc(item.date) + '\',this.value)">' +
          '<button class="iconbtn" onclick="event.stopPropagation();cancelValuePlan(\'' + esc(g.caseId) + '\',\'' + esc(item.id) + '\',\'' + esc(item.date) + '\')">×</button>'
        : '<button class="smallbtn" onclick="event.stopPropagation();toggleEventDone(\'' + esc(g.caseId) + '\',\'' + esc(item.id) + '\',todayISO())">' + esc(STR.markDone) + '</button>' +
          '<input class="date" type="date" value="' + esc(item.date) + '" onclick="event.stopPropagation()" onchange="rescheduleChartEntry(\'' + esc(g.caseId) + '\',\'' + esc(item.id) + '\',\'\',this.value)">' +
          '<button class="iconbtn" onclick="event.stopPropagation();removeChartItem(\'' + esc(g.caseId) + '\',\'' + esc(item.id) + '\')">×</button>';
      return '<div class="lineitem"><div class="linegrow"><div class="text">' + esc(item.text) + '</div><div class="faint">' + esc(item.date) + '</div></div>' + resolve + '</div>';
    }).join('') + '</div>' : '';
    return '<div class="daygroup"><div class="labelrow dayhead" onclick="openDetail(\'' + esc(g.caseId) + '\')"><div class="caseid">' + esc(g.label || '—') + ' D' + computeDay(g.admittedAt, today) + '</div><div class="stagechip">' + stageDot(stage) + '<span>' + esc(stage.name) + '</span></div><div class="grow"></div><button class="smallbtn" onclick="event.stopPropagation();openWeekCell(\'' + esc(g.caseId) + '\',\'' + esc(date) + '\')">＋</button></div>' + overdueHtml + '<div class="plain">' + normalItems.map(function(item){
      if (item.type === "todo") {
        var rolledDue = item.due && item.due !== date ? item.due : "";
        return '<label class="lineitem" onclick="event.stopPropagation()"><input class="check" type="checkbox" onclick="toggleTodo(\'' + esc(g.caseId) + '\',\'' + esc(item.id) + '\')"><div class="linegrow"><div class="text">' + esc((item.time ? item.time + ' ' : '') + item.text) + '</div>' + (rolledDue ? '<div class="faint">' + esc(rolledDue) + '</div>' : '') + '</div></label>';
      }
      if (item.type === "event") {
        return '<label class="lineitem" onclick="event.stopPropagation()"><input class="check" type="checkbox" ' + (item.status === "done" ? 'checked ' : '') + 'onclick="toggleEventDone(\'' + esc(g.caseId) + '\',\'' + esc(item.id) + '\')"><div class="linegrow"><div class="text">' + esc(item.text) + '</div></div></label>';
      }
      if (item.type === "valuePlan") {
        return '<div class="lineitem" onclick="event.stopPropagation();openChartValue(\'' + esc(g.caseId) + '\',\'' + esc(item.id) + '\',\'' + esc(date) + '\')"><div class="linegrow"><div class="text">◇ ' + esc(item.text) + '</div><div class="faint">' + esc(item.entered ? STR.markDone : STR.valueEnterPh) + '</div></div></div>';
      }
      if (item.type === "discharge") {
        return '<div class="lineitem" onclick="openDetail(\'' + esc(g.caseId) + '\')"><div class="linegrow"><div class="text">★ ' + esc(STR.dayDischargeLabel) + '</div></div></div>';
      }
      return '<div class="lineitem" onclick="openDetail(\'' + esc(g.caseId) + '\')"><div class="linegrow"><div class="text"><span class="faint">' + esc(STR.dayPendingPrefix) + ':</span> ' + esc(item.text) + '</div></div></div>';
    }).join('') + '</div></div>';
  }).join('') : '<div class="empty">' + esc(STR.dayEmpty) + '</div>';
  return nav + bodyHtml;
}

function renderTagList(c){
  return '<div class="chips">' + c.dxTags.map(function(tag, i){
    return '<span class="tag">' + esc(tag) + '<button onclick="removeDxTag(\'' + esc(c.id) + '\',' + i + ')">×</button></span>';
  }).join('') + '</div>';
}

function runSearch(){
  var q = document.getElementById("searchInput");
  var month = document.getElementById("searchMonth");
  var stage = document.getElementById("searchStage");
  VIEW.searchQuery = q ? q.value : VIEW.searchQuery;
  VIEW.searchMonth = month ? month.value : VIEW.searchMonth;
  VIEW.searchStageId = stage ? stage.value : VIEW.searchStageId;
  render();
}

function renderSearch(){
  var hits = searchCases(DB.cases, VIEW.searchQuery, { month:VIEW.searchMonth, stageId:VIEW.searchStageId });
  var grouped = {};
  cloneArr(DB.cases).filter(function(c){ return c.status === "discharged"; }).forEach(function(c){
    var key = String(c.dischargedAt || "").slice(0, 7) || "unknown";
    grouped[key] = grouped[key] || [];
    grouped[key].push(c);
  });
  return '<section class="screen"><div class="stack"><div class="searchbar"><input id="searchInput" class="input" value="' + esc(VIEW.searchQuery || "") + '" placeholder="' + esc(STR.searchPh) + '" onchange="runSearch()"><button class="ghostbtn" onclick="runSearch()">' + esc(STR.searchRun) + '</button></div><div class="filters"><select id="searchMonth" class="input" onchange="runSearch()"><option value="">' + esc(STR.monthFilter) + '</option>' + caseMonthOptions().map(function(month){
    return '<option value="' + esc(month) + '"' + (VIEW.searchMonth === month ? ' selected' : '') + '>' + esc(month) + '</option>';
  }).join('') + '</select><select id="searchStage" class="input" onchange="runSearch()"><option value="">' + esc(STR.stageFilter) + '</option>' + DB.config.stages.map(function(stage){
    return '<option value="' + esc(stage.id) + '"' + (VIEW.searchStageId === stage.id ? ' selected' : '') + '>' + esc(stage.name) + '</option>';
  }).join('') + '</select></div>' + (String(VIEW.searchQuery || "").trim()
    ? '<div class="list">' + hits.map(function(hit){
      var c = hit.case;
      return '<article class="card" onclick="openDetail(\'' + esc(c.id) + '\')"><div class="labelrow"><div class="caseid">' + esc(c.label) + '</div><div class="meta">D' + computeDay(c.admittedAt, todayISO()) + '</div><div class="stagechip">' + esc(c.status === "discharged" ? STR.dischargedAtLine + " " + (c.dischargedAt || "") : stageById(c.stageId).name) + '</div></div><div class="subtleline">' + esc(hit.hint || "") + '</div></article>';
    }).join('') + '</div>'
    : '<div class="stack"><div class="one">' + esc(STR.dischargedGroup) + '</div>' + Object.keys(grouped).sort().reverse().map(function(month){
      return '<section class="panelcard"><div class="fieldlabel">' + esc(month) + '</div><div class="plain">' + grouped[month].map(function(c){
        return '<button class="lineitem" onclick="openDetail(\'' + esc(c.id) + '\')"><div class="linegrow"><div class="text">' + esc(c.label) + '</div><div class="faint">' + esc(c.dischargedAt || "") + '</div></div></button>';
      }).join('') + '</div></section>';
    }).join('') + '</div>') + '</div></section>';
}

function renderWeekCellSheet(){
  var d = SHEET.draft || {};
  var c = DB.cases.find(function(item){ return item.id === d.caseId; });
  var rows = [];
  if (c) {
    cloneArr(c.pendings).filter(function(item){ return item.backOn === d.date; }).forEach(function(item){
      rows.push('<div class="lineitem"><span class="badge">' + esc(DB.config.labels.pending) + '</span><div class="linegrow"><div class="text">' + esc(item.text) + '</div></div><button class="iconbtn" onclick="deletePending(\'' + esc(d.caseId) + '\',\'' + esc(item.id) + '\');renderSheet()">\u00d7</button></div>');
    });
    var todayIso = todayISO();
    cloneArr(c.todos).filter(function(item){
      // Same visibility rule as the grid marker (buildWeekGrid): today's cell
      // carries every undone rolled-over task, future cells their scheduled day.
      if (!item || item.done) return false;
      return d.date === todayIso
        ? (item.due ? item.due <= todayIso : item.createdOn <= todayIso)
        : (d.date > todayIso && (item.due ? item.due === d.date : item.createdOn === d.date));
    }).forEach(function(item){
      rows.push('<div class="lineitem"><span class="badge">' + esc(DB.config.labels.task) + '</span><div class="linegrow"><div class="text">' + esc((item.time ? item.time + ' ' : '') + item.text) + '</div></div><button class="iconbtn" onclick="deleteTodo(\'' + esc(d.caseId) + '\',\'' + esc(item.id) + '\');renderSheet()">\u00d7</button></div>');
    });
    cloneArr(c.chart && c.chart.items).forEach(function(item){
      if (!item) return;
      var cat = chartCatById(item.catId);
      var catName = cat ? cat.name : "";
      if (item.kind === "event" && item.date === d.date) {
        rows.push('<div class="lineitem"><span class="badge">' + esc(catName) + '</span><div class="linegrow"><div class="text">' + esc(item.name) + '</div></div>' +
          '<button class="iconbtn" onclick="toggleEventDone(\'' + esc(d.caseId) + '\',\'' + esc(item.id) + '\');renderSheet()">' + (item.status === "done" ? '\u2713' : '\u25a1') + '</button>' +
          '<input class="date" type="date" value="' + esc(item.date) + '" onchange="rescheduleChartEntry(\'' + esc(d.caseId) + '\',\'' + esc(item.id) + '\',\'\',this.value);renderSheet()">' +
          '<button class="iconbtn" onclick="removeChartItem(\'' + esc(d.caseId) + '\',\'' + esc(item.id) + '\');renderSheet()">\u00d7</button></div>');
      }
      if (item.kind === "value" && isObj(item.planned) && item.planned[d.date]) {
        var entered = !!(isObj(item.values) && item.values[d.date]);
        rows.push('<div class="lineitem"><span class="badge">' + esc(catName) + '</span><div class="linegrow"><div class="text">\u25c7' + esc(item.name) + '</div><div class="faint">' + esc(entered ? STR.markDone : STR.planBadge) + '</div></div>' +
          '<input class="date" type="date" value="' + esc(d.date) + '" onchange="rescheduleChartEntry(\'' + esc(d.caseId) + '\',\'' + esc(item.id) + '\',\'' + esc(d.date) + '\',this.value);renderSheet()">' +
          '<button class="iconbtn" onclick="cancelValuePlan(\'' + esc(d.caseId) + '\',\'' + esc(item.id) + '\',\'' + esc(d.date) + '\');renderSheet()">\u00d7</button></div>');
      }
    });
  }
  var chips = [
    { key:"todo", label:DB.config.labels.task },
    { key:"pending", label:DB.config.labels.pending }
  ];
  cloneArr(DB.config.chartCats).forEach(function(cat){
    if (cat.kind === "event" || cat.kind === "value") chips.push({ key:"cat:" + cat.id, label:cat.name });
  });
  var bandChips = cloneArr(DB.config.chartCats).filter(function(cat){ return cat.kind === "band"; }).map(function(cat){
    return '<button class="chipbtn" onclick="openChartItemForDate(\'' + esc(d.caseId) + '\',\'' + esc(cat.id) + '\',\'' + esc(d.date) + '\')">' + esc(cat.name) + '\u2026</button>';
  }).join('');
  var active = d.itemType || "todo";
  return '<div class="sheetcard"><div class="sheettitle">' + esc((c ? c.label + " " : "") + (d.date || "")) + '</div><div class="stack">' +
    '<div class="chips">' + chips.map(function(chip){
      return '<button class="chipbtn' + (active === chip.key ? ' on' : '') + '" onclick="setCellDraftType(\'' + esc(chip.key) + '\')">' + esc(chip.label) + '</button>';
    }).join('') + bandChips + '</div>' +
    '<div class="row"><input id="weekCellInput" class="input" value="' + esc(d.text || "") + '" oninput="sheetDraftValue(\'text\',this.value)" onkeydown="if(event.key===\'Enter\'&&!event.isComposing){addCellItem(\'' + esc(d.caseId) + '\',\'' + esc(d.date) + '\')}"><button class="ghostbtn" onclick="addCellItem(\'' + esc(d.caseId) + '\',\'' + esc(d.date) + '\')">+</button></div>' +
    '<div class="plain">' + (rows.length ? rows.join('') : '<div class="faint">-</div>') + '</div><button class="ghostbtn" onclick="closeSheet()">' + esc(STR.cancel) + '</button></div></div>';
}

function renderPlanSheet(){
  var d = SHEET.draft || {};
  var c = DB.cases.find(function(item){ return item.id === d.caseId; });
  var discharge = !!d.discharge;
  return '<div class="sheetcard"><div class="sheettitle">' + esc((c ? (c.label || '-') + ' ' : '') + STR.planSheetTitle) + '</div><div class="stack">' +
    (discharge ? '' : '<div class="row"><input id="planText" class="input" placeholder="' + esc(STR.planTextPh) + '" value="' + esc(d.text || '') + '" oninput="sheetDraftValue(\'text\',this.value)" onkeydown="if(event.key===\'Enter\'&&!event.isComposing){addPlanFromSheet()}"></div>') +
    '<div class="row wrap"><span class="fieldlabel">' + esc(discharge ? STR.plannedOn : STR.dueLabel) + '</span><input class="date" type="date" value="' + esc(d.date || '') + '" onchange="sheetDraftValue(\'date\',this.value)">' +
    (discharge ? '' : '<span class="fieldlabel">' + esc(STR.timeLabel) + '</span><input class="date" type="time" value="' + esc(d.time || '') + '" onchange="sheetDraftValue(\'time\',this.value)">') + '</div>' +
    '<label class="row"><input class="check" type="checkbox" ' + (discharge ? 'checked ' : '') + 'onclick="setPlanDischarge(this.checked)"><div class="text">' + esc(STR.planAsDischarge) + '</div></label>' +
    '<div class="bottomrow"><button class="primary" onclick="addPlanFromSheet()">' + esc(STR.planSaveBtn) + '</button><button class="ghostbtn" onclick="closeSheet()">' + esc(STR.cancel) + '</button></div>' +
  '</div></div>';
}

function chartEventMarkClass(item, today){
  if (item.status !== "planned") return "evdone";
  return item.date < today ? "overdue" : "evplan";
}

function chartEventMarkText(item){
  var head = item.status === "done" ? "✓" : (item.date < todayISO() ? "⚠" : "□");
  return head + (String(item.name || '').slice(0, 2) || '●');
}

function renderChartEventDots(items, date, today){
  var hits = cloneArr(items).filter(function(item){ return item && item.date === date; });
  if (!hits.length) return '';
  return hits.slice(0, 2).map(function(item){
    return '<span class="mark ' + esc(chartEventMarkClass(item, today)) + '">' + esc(chartEventMarkText(item)) + '</span>';
  }).join('') + (hits.length > 2 ? '<span class="mark">+' + (hits.length - 2) + '</span>' : '');
}

function expandChartPast(){
  VIEW.chartPast = (Number.isFinite(Number(VIEW.chartPast)) ? Number(VIEW.chartPast) : 3) + 7;
  render();
}

function expandChartFuture(){
  VIEW.chartFuture = (Number.isFinite(Number(VIEW.chartFuture)) ? Number(VIEW.chartFuture) : 0) + 7;
  render();
}

function renderChartPanel(c){
  var open = !!VIEW.chartOpen;
  var head = '<div class="collapsehead" onclick="toggleChartPanel()"><div class="one">' + esc(STR.chartPanel) + '</div><div class="meta">' + (open ? '-' : '+') + '</div></div>';
  if (!open) return '<section class="panelcard anchor" id="anc-chart">' + head + '</section>';
  var today = todayISO();
  var allDates = chartDates(c, today);
  // The chart's own dates stop at the last entered value/plan (never past what
  // you've planned). Past accumulates on its own (days since admission), but the
  // future is blank until you fill it — so ▶ extends the grid with empty future
  // days you can tap to plan. ◀ widens the past window 7 days at a time. Wide
  // screens (landscape / PC) show the whole stay with no buttons.
  var pastN = Number.isFinite(Number(VIEW.chartPast)) ? Math.max(0, Number(VIEW.chartPast)) : 3;
  var futureN = Number.isFinite(Number(VIEW.chartFuture)) ? Math.max(0, Number(VIEW.chartFuture)) : 0;
  var wide = typeof window !== "undefined" && window.innerWidth >= 860;
  var pastDates = allDates.filter(function(d){ return d <= today; });
  var hiddenPast = Math.max(0, pastDates.length - (pastN + 1));
  var startDate = (!wide && hiddenPast > 0) ? pastDates[pastDates.length - (pastN + 1)] : (allDates[0] || today);
  var lastData = allDates.length ? allDates[allDates.length - 1] : today;
  var startMs = Date.parse(startDate + "T00:00:00");
  var endMs = Math.max(Date.parse(lastData + "T00:00:00"), Date.parse(today + "T00:00:00") + futureN * 86400000);
  var dates = [];
  for (var curMs = startMs; Number.isFinite(curMs) && Number.isFinite(endMs) && curMs <= endMs && dates.length < 400; curMs += 86400000) {
    var dCol = new Date(curMs);
    dates.push(dCol.getFullYear() + "-" + String(dCol.getMonth() + 1).padStart(2, "0") + "-" + String(dCol.getDate()).padStart(2, "0"));
  }
  var marks = chartColMarks(c);
  var groups = chartRowsForCase(c, DB.config.chartCats).filter(function(group){
    return group.orphan || !chartCatHidden(group.cat.id);
  });
  // Single header row: M/D headline, D-number beneath, then the admit/discharge
  // column mark. (Merged from the old two-row D-number + M/D pair to save height.)
  var headRow = '<tr><th class="sticky"></th>' + dates.map(function(date){
    return '<th class="' + (date === today ? 'todaycol' : '') + '" onclick="openChartDaySheet(\'' + esc(c.id) + '\',\'' + esc(date) + '\')">' + esc(Number(date.slice(5, 7)) + '/' + Number(date.slice(8, 10))) + '<span class="dnum">D' + computeDay(c.admittedAt, date) + '</span><span class="colmark">' + (marks[date] ? esc(marks[date]) : '&nbsp;') + '</span></th>';
  }).join('') + '</tr>';
  var body = groups.map(function(group){
    var cat = group.cat;
    var groupKey = cat.id || "orphan";
    var collapsed = chartGroupCollapsed(c.id, groupKey);
    var addBtn = group.orphan ? '' : (cat.kind === "event"
      ? ' <button class="smallbtn" onclick="event.stopPropagation();openChartEventCell(\'' + esc(c.id) + '\',\'' + esc(cat.id) + '\',\'' + esc(today) + '\')">＋</button>'
      : ' <button class="smallbtn" onclick="event.stopPropagation();openChartItem(\'' + esc(c.id) + '\',\'' + esc(cat.id) + '\',\'\')">＋</button>');
    var headerRow = '<tr><th class="sticky catrow" onclick="toggleChartGroup(\'' + esc(c.id) + '\',\'' + esc(groupKey) + '\')"><span class="dot" style="display:inline-block;background:' + esc(cat.color) + '"></span> ' + esc(cat.name) + ' ' + (collapsed ? '+' : '-') + addBtn + '</th><td colspan="' + dates.length + '"></td></tr>';
    if (collapsed) return headerRow;
    var rows = '';
    if (!group.orphan && cat.kind === "event") {
      rows = group.items.length ? '<tr><th class="sticky chartlabel"></th>' + dates.map(function(date){
        return '<td class="' + (date === today ? 'todaycol' : '') + '" onclick="openChartEventCell(\'' + esc(c.id) + '\',\'' + esc(cat.id) + '\',\'' + esc(date) + '\')">' + renderChartEventDots(group.items, date, today) + '</td>';
      }).join('') + '</tr>' : '';
    } else {
      rows = group.items.map(function(item){
        var labelTh = '<th class="sticky chartlabel" onclick="openChartItem(\'' + esc(c.id) + '\',\'' + esc(item.catId) + '\',\'' + esc(item.id) + '\')">' + esc(item.name || '-') + '</th>';
        if (item.kind === "band") {
          return '<tr>' + labelTh + dates.map(function(date){
            return '<td class="bandcell' + (date === today ? ' todaycol' : '') + '">' + (bandOnDate(item, date) ? '<div class="band" style="background:' + esc(cat.color) + '"></div>' : '') + '</td>';
          }).join('') + '</tr>';
        }
        if (item.kind === "event") {
          return '<tr>' + labelTh + dates.map(function(date){
            return '<td class="' + (date === today ? 'todaycol' : '') + '">' + (item.date === date ? '<span class="mark ' + esc(chartEventMarkClass(item, today)) + '">' + esc(chartEventMarkText(item)) + '</span>' : '') + '</td>';
          }).join('') + '</tr>';
        }
        return '<tr>' + labelTh + dates.map(function(date){
          var val = (item.values && item.values[date]) || '';
          var plannedHere = !val && isObj(item.planned) && item.planned[date];
          var planMark = plannedHere ? '<span class="mark ' + (date < today ? 'overdue' : 'evplan') + '">' + (date < today ? '⚠' : '◇') + '</span>' : '';
          return '<td class="' + (date === today ? 'todaycol' : '') + '" onclick="openChartValue(\'' + esc(c.id) + '\',\'' + esc(item.id) + '\',\'' + esc(date) + '\')">' + (val ? esc(val) : planMark) + '</td>';
        }).join('') + '</tr>';
      }).join('');
    }
    return headerRow + rows;
  }).join('');
  var pastBtn = (!wide && hiddenPast > 0) ? '<button class="ghostbtn smallbtn" onclick="expandChartPast()">◀ 過去を表示</button>' : '';
  var futureBtn = !wide ? '<button class="ghostbtn smallbtn" onclick="expandChartFuture()">未来を表示 ▶</button>' : '';
  var navRow = (pastBtn || futureBtn) ? '<div class="row" style="margin-top:8px;justify-content:space-between">' + (pastBtn || '<span></span>') + (futureBtn || '<span></span>') + '</div>' : '';
  return '<section class="panelcard anchor" id="anc-chart">' + head + navRow + '<div class="scrollhintwrap" style="margin-top:10px"><div class="chartwrap"><table class="chartgrid"><thead>' + headRow + '</thead><tbody>' + body + '</tbody></table></div></div></section>';
}

// Unified Task rows (Next+Today merged): checkbox / text / scheduled date
// (optional) / time (optional) / done->pending shortcut / delete.
// Task rows collapse to one line by default (B-1, CEO 2026-07-22): the always-
// open date/time editor made each row ~130px tall and the detail screen scroll-
// heavy. Tapping the text (or 編集) opens the full editor for that row only;
// VIEW.taskOpen is screen-local state — never stored, never synced.
function renderTaskList(c){
  // Unfinished work plus today's ticks. Everything completed earlier is still
  // stored — it is read in the course panel, not here.
  return visibleTodos(c, todayISO()).map(function(item){
    var open = VIEW.taskOpen === item.id;
    var check = '<input class="check" type="checkbox" ' + (item.done ? 'checked ' : '') + 'onclick="toggleTodo(\'' + esc(c.id) + '\',\'' + esc(item.id) + '\')">';
    if (!open) {
      var when = (item.due ? item.due.slice(5) : '') + (item.time ? ' ' + item.time : '');
      return '<div class="lineitem">' + check +
        '<div class="linegrow"><div class="compactline" onclick="openTaskEditor(\'' + esc(c.id) + '\',\'' + esc(item.id) + '\')"><div class="text' + (item.done ? ' faint' : '') + '">' + esc(item.text) + '</div>' + (when ? '<span class="datechip">' + esc(when) + '</span>' : '') + '</div>' +
      '</div><button class="smallbtn" onclick="openTaskEditor(\'' + esc(c.id) + '\',\'' + esc(item.id) + '\')">' + esc(STR.taskEditBtn) + '</button></div>';
    }
    return '<div class="lineitem">' + check +
      '<div class="linegrow"><input class="input subedit" value="' + esc(item.text) + '" onchange="updateTodoText(\'' + esc(c.id) + '\',\'' + esc(item.id) + '\',this.value)">' +

      '<span class="fieldlabel">' + esc(STR.timeLabel) + '</span><input class="date" type="time" value="' + esc(item.time || '') + '" onchange="updateTodoTime(\'' + esc(c.id) + '\',\'' + esc(item.id) + '\',this.value)">' +
      (item.done ? '' : '<button class="smallbtn" onclick="taskToPending(\'' + esc(c.id) + '\',\'' + esc(item.id) + '\')">' + esc(STR.toPendingBtn) + '</button>') +
      '<button class="smallbtn" onclick="closeTaskEditor()">' + esc(STR.taskEditClose) + '</button></div>' +

// Open waits stay editable at the top; resolved ones drop to a quiet list
// underneath instead of disappearing (2026-07-31). "返ってきた" is the normal
// end of a wait — × remains for typos, and 戻す undoes a mis-tap.
function renderPendingList(c){
  var open = openPendings(c);
  var closed = cloneArr(c.pendings).filter(function(x){ return x && x.closedOn; })
    .sort(function(a, b){ return String(b.closedOn).localeCompare(String(a.closedOn)); });

// URL, a javascript: scheme, a parent-directory hop) is refused rather than

  return /^[A-Za-z0-9_%.\-]+(\/[A-Za-z0-9_%.\-]+)*$/.test(p) && p.indexOf("..") < 0 ? VAULT_HTML_URL + p : "";
}

// ---- nudge UI (Phase 2) ---------------------------------------------------
// A mark on the card, a single question at the top of the course panel, and two
// taps to be rid of it. Deliberately NOT a modal, a notification, or a nightly
// ritual: 夕の棚卸し died because it asked the user to show up at a fixed time.
function caseNudge(c){
  return pendingNudge(c, todayISO(), DB.config && DB.config.nudge);
}

function nudgePromptText(c, nudge){
  if (!nudge) return "";
  if (nudge.trigger === "stageChanged") return STR.nudgeStageChanged;
  if (nudge.trigger === "waitClosed") return STR.nudgeWaitClosed.replace("{0}", String(nudge.subject || ""));
  if (nudge.trigger === "stageStale") return STR.nudgeStageStale.replace("{0}", stageNameFor(nudge.subject));
  return STR.nudgeTaskStalled;
}

function recordNudge(caseId, key, prompt, answer, skipped){
  addListItem("qLogs", caseId, key, null, function(){
    return { id:uid(), key:key, text:String(answer || ""), prompt:String(prompt || ""), skipped:!!skipped, date:todayISO() };
  });

}

function answerNudge(caseId, key, prompt, fixedAnswer){
  var box = document.getElementById("nudgeInput");
  var typed = box && box.value ? String(box.value).trim() : "";
  // A fixed choice (変えた/変えない/そのまま) and free text are complementary:
  // the choice is the answer, anything typed refines it.
  var answer = [fixedAnswer || "", typed].filter(Boolean).join("：");
  recordNudge(caseId, key, prompt, answer, false);
}

function skipNudge(caseId, key, prompt){
  recordNudge(caseId, key, prompt, "", true);
}

function runAiFeedback(caseId){
  var c = DB.cases.find(function(row){ return row.id === caseId; });
  // Single-flight: one fetch at a time keeps the global AI state (and the
  // board-card badge derived from it) unambiguous.
  if (!c || AI.status === "loading") return;
  var payload = aiFeedbackPayload(c);
  var hasBody = String(payload.adm).trim() || payload.notes.some(function(n){ return String(n.text || "").trim(); });
  if (!hasBody) {
    AI = { caseId:caseId, status:"error", text:STR.aiEmpty };
    render();
    return;
  }
  var token = aiToken();
  if (!token) return;
  AI = { caseId:caseId, status:"loading", text:"" };
  render();
  fetch(AI_URL, {
    method:"POST",
    headers:{ "Content-Type":"application/json", "X-WB-Token":token },
    body:JSON.stringify(Object.assign({}, payload, { sys: aiPromptText() }))
  }).then(function(res){
    if (res.status === 401) {
      try { localStorage.removeItem("wb_ai_token"); } catch (e) {}
      throw new Error("auth");
    }
    if (!res.ok) throw new Error("http" + res.status);
    return res.json();
  }).then(function(data){
    var text = String((data && data.text) || "").trim();
    if (!text) throw new Error("empty");
    // The fetch keeps running after leaving the detail screen; "done" drives
    // the board-card badge until the case is next opened. The fresh log starts
    // expanded so it can be read immediately.
    var itemId = uid();
    AI = { caseId:caseId, status:"done", text:"" };
    VIEW.aiOpen = isObj(VIEW.aiOpen) ? VIEW.aiOpen : {};
    VIEW.aiOpen[itemId] = true;
    // Persist via the shared list CRUD so entries absorption + sync ride along.
    addListItem("aiLogs", caseId, text, null, function(t){ return { id:itemId, text:t, date:todayISO() }; });
  }).catch(function(err){
    AI = { caseId:caseId, status:"error", text:(err && err.message === "auth") ? STR.aiAuthError : STR.aiError };
    render();
  });
}

// Renal calculator sheet. Layout is deliberately lopsided: CCr is the headline
// because it is the value you dose from, eGFR sits below at half the weight
// with its "not for dosing" caption attached (1_MKM answer B-1). Never present
// the two as equals.
// Values for the tool in hand. With a case they come from (and go back to) the
// case; without one they come from CALC_SCRATCH and are thrown away on close.
function calcValuesFor(caseId){
  var vals = {};
  if (caseId) {
    var c = DB.cases.find(function(item){ return item.id === caseId; });
    if (!c) return null;
    var bio = isObj(c.bio) ? c.bio : {};
    for (var key in bio) if (Object.prototype.hasOwnProperty.call(bio, key)) vals[key] = bio[key];
    vals.sex = c.sex || "";
  }
  // store:"none" values always come from scratch — with a case open or not.
  // The sheet clears scratch on every open, so yesterday's SpO2 can never sit
  // in today's score looking current.
  for (var k in CALC_SCRATCH) if (Object.prototype.hasOwnProperty.call(CALC_SCRATCH, k)) vals[k] = CALC_SCRATCH[k];
  return vals;
}

// The tool list, without the surrounding card. Both surfaces (sheet and tab)

// The calculator itself, drawn the same way wherever it appears. The sheet adds
// a title bar and a close button; the tab adds neither. Keeping one body means a
// new score never has to be laid out twice.
function calcToolBody(tool){
  var caseId = VIEW.calcFor || "";
  var values = calcValuesFor(caseId);
  if (values === null) return '';
  var results = calcCollect(tool, values);
  var anyResult = results.some(function(r){ return r.value !== null; });
  function bigResult(r){
    var shown = r.value === null ? '—' : String(r.value);
    var band = r.bandKey && STR[r.bandKey] ? '<div class="calcband">' + esc(STR[r.bandKey]) + '</div>' : '';
    return '<div class="calcresult"><div class="fieldlabel">' + esc(STR[r.labelKey]) + '</div>' +
      '<div class="calcvalue">' + esc(shown) + ' <span class="calcunit">' + esc(STR[r.unitKey]) + '</span></div>' +
      band + '<div class="faint">' + esc(STR[r.useKey]) + '</div></div>';
  }
  // main:false renders smaller inside .calcsub. The size gap is the safety
  // feature: CCr (dosing) must not read as interchangeable with eGFR (staging)
  // at a glance, so the difference is structural, not just wording.
  function resultBlock(r){
    var inner = bigResult(r) + (r.formulaKey ? '<div class="faint">' + esc(STR[r.formulaKey]) + '</div>' : '');
    return r.main ? inner : '<div class="calcsub">' + inner + '</div>';
  }
  function field(key){
    var def = CALC_FIELDS[key];
    if (!def) return '';
    var label = esc(STR[def.labelKey] || key);
    var value = values[key];
    if (def.type === "sex") {
      var cur = values.sex || "";
      function sexChip(code, text){
        return '<button class="chipbtn' + (cur === code ? ' on' : '') + '" onclick="updateCaseBio(\'' + esc(caseId) + '\',\'sex\',\'' + esc(code) + '\')">' + esc(text) + '</button>';
      }
      return '<div class="field"><div class="fieldlabel">' + label + '</div><div class="chips">' +
        sexChip("", STR.unset) + sexChip("M", STR.sexM) + sexChip("F", STR.sexF) + '</div></div>';
    }
    if (def.type === "bool3") {
      var cur3 = value === true ? "true" : value === false ? "false" : "";
      function triChip(code, text){
        return '<button class="chipbtn' + (cur3 === code ? ' on' : '') + '" onclick="updateCaseBio(\'' + esc(caseId) + '\',\'' + esc(key) + '\',\'' + code + '\')">' + esc(text) + '</button>';
      }
      return '<div class="field"><div class="fieldlabel">' + label + '</div><div class="chips">' +
        triChip("", STR.unset) + triChip("true", STR.calcYes) + triChip("false", STR.calcNo) + '</div>' +
        (def.noteKey ? '<div class="faint">' + esc(STR[def.noteKey]) + '</div>' : '') + '</div>';
    }
    if (def.type === "grade") {
      var curG = value === 1 || value === 2 || value === 3 ? String(value) : "";
      var chips = '<button class="chipbtn' + (curG === "" ? ' on' : '') + '" onclick="updateCaseBio(\'' + esc(caseId) + '\',\'' + esc(key) + '\',\'\')">' + esc(STR.unset) + '</button>';
      (def.choices || []).forEach(function(ck, i){
        var code = String(i + 1);
        chips += '<button class="chipbtn' + (curG === code ? ' on' : '') + '" onclick="updateCaseBio(\'' + esc(caseId) + '\',\'' + esc(key) + '\',\'' + code + '\')">' + esc(STR[ck]) + '</button>';
      });
      return '<div class="field"><div class="fieldlabel">' + label + '</div><div class="chips">' + chips + '</div>' +
        (def.noteKey ? '<div class="faint">' + esc(STR[def.noteKey]) + '</div>' : '') + '</div>';
    }
    var type = def.type === "date" ? "date" : "number";
    var note = def.noteKey ? STR[def.noteKey] : "";
    if (!note && def.emptyNoteKey && !value) note = STR[def.emptyNoteKey];
    return '<div class="field"><div class="fieldlabel">' + label + '</div>' +
      '<input class="' + (type === "date" ? "date" : "input") + '" type="' + type + '"' +
      (type === "number" ? ' inputmode="decimal" step="any" min="0"' : '') +
      ' value="' + esc(value === null || value === undefined ? "" : String(value)) + '"' +
      ' onchange="updateCaseBio(\'' + esc(caseId) + '\',\'' + esc(key) + '\',this.value)">' +
      (note ? '<div class="faint">' + esc(note) + '</div>' : '') + '</div>';
  }
  return (caseId ? '' : '<div class="note">' + esc(STR.calcNoCase) + '</div>') +
    (anyResult ? '' : '<div class="note">' + esc(STR[tool.needKey]) + '</div>') +
    calcWarnKeys(tool, values).map(function(msgKey){ return '<div class="note warn">' + esc(STR[msgKey]) + '</div>'; }).join('') +
    results.map(resultBlock).join('') +
    tool.fields.map(field).join('') +
    ((caseId && anyResult) ? '<div class="faint">' + esc(STR.calcAutoSavedNote) + '</div>' : '') +
    (tool.rangeKey ? '<div class="note">' + esc(STR[tool.rangeKey]) + '</div>' : '') +
    '<div class="note warn">' + esc(STR[tool.disclaimerKey]) + '</div>' +
    '<div class="faint">' + esc(STR[tool.sourceKey]) + '</div>';
}

// ---- learning conquest map tab (retro-RPG theme, styling under .learnrpg) ---
// One state per territory: fog (untouched) / frontier (unmastered learnings) /
// controlled (all mastered). Rendered as RPG map tiles (.tile ctrl/front/fog);
// frontier tiles blink ("battle here"), controlled tiles glow.
function learnStateMark(state){
  return state === "controlled" ? "★" : state === "frontier" ? "⚔" : "·";
}
function learnTileClass(state){
  return state === "controlled" ? "ctrl" : state === "frontier" ? "front" : "fog";
}
// Region icons give each continent a Pokemon-type-like face.
var ORGAN_ICON = {
  "総合内科":"🏥", "消化器":"🍽️", "循環器":"❤️", "内分泌":"🧬", "代謝":"🍬", "腎臓":"💧",
  "呼吸器":"🫁", "血液":"🩸", "神経":"🧠", "アレルギー":"🌿", "膠原病":"🛡️", "感染症":"🦠", "救急":"🚑"
};
function learnTile(t){
  var count = t.total ? ' ' + t.mastered + '/' + t.total : '';
  return '<span class="tile ' + learnTileClass(t.state) + '">' + learnStateMark(t.state) + esc(t.name) + count + '</span>';
}
// A continent (organ system) row: icon + name + mini conquest bar + province tiles.
function learnContinent(c){
  var pctW = c.totalProvinces ? Math.round(c.controlled / c.totalProvinces * 100) : 0;
  return '<div class="region">' +
    '<div class="regionhd"><span class="regionic">' + (ORGAN_ICON[c.sys] || "🗺️") + '</span>' +
      '<span class="regionnm">' + learnStateMark(c.state) + ' ' + esc(c.name) + '</span>' +
      '<span class="minibar"><span class="minifill" style="width:' + pctW + '%"></span></span>' +
      '<span class="faint" style="font-size:12px;margin-left:6px">' + c.controlled + '/' + c.totalProvinces + '</span></div>' +
    '<div class="tiles">' + c.provinces.map(learnTile).join('') + '</div>' +
  '</div>';
}
// Per-learning tag pickers: one grouped province select (picking a province also
// sets its continent) + the competency domain. Reassigning wins over the AI text.
function learnTagEditor(it){
  var groups = ORGAN_FIELDS.map(function(sys){
    var opts = provincesOf(sys).map(function(p){
      return '<option value="' + esc(p.id) + '"' + (it.province === p.id ? ' selected' : '') + '>' + esc(p.name) + '</option>';
    }).join('');
    return '<optgroup label="' + esc(sys) + '">' + opts + '</optgroup>';
  }).join('');
  var provSel = '<select class="input" style="flex:1;min-width:130px" onchange="setLearningProvince(\'' + esc(it.caseId) + '\',\'' + esc(it.id) + '\',this.value)"><option value="">' + esc(STR.learnUncat) + '</option>' + groups + '</select>';
  var domOpts = '<option value="0">' + esc(STR.learnDomainNone) + '</option>' + PF_DOMAINS.map(function(n, i){
    return '<option value="' + (i + 1) + '"' + (it.domain === i + 1 ? ' selected' : '') + '>' + esc(n) + '</option>';
  }).join('');
  var domSel = '<select class="input" style="flex:1;min-width:130px" onchange="setLearningDomain(\'' + esc(it.caseId) + '\',\'' + esc(it.id) + '\',this.value)">' + domOpts + '</select>';
  return '<div class="row wrap" style="gap:6px;margin-top:6px">' + provSel + domSel + '</div>';
}
function learnChips(it){
  var pp = it.province ? provinceById(it.province) : null;
  var prov = pp ? pp.name : (it.field || "");
  return (prov ? '<span class="badge">' + esc(prov) + '</span> ' : '') +
    (it.domain ? '<span class="badge">' + esc(PF_DOMAINS[it.domain - 1]) + '</span> ' : '');
}

        learnTagEditor(it) +
        '<div class="row" style="margin-top:6px;gap:6px">' + masterBtn +
        '<button class="smallbtn" onclick="openDetail(\'' + esc(it.caseId) + '\')">' + esc(STR.learnOpenCase) + '</button></div>';
    }
    return '<div class="lineitem"><div class="linegrow">' + head + body + '</div></div>';
  }).join('');
  var listSec = '<div class="rpgwin"><div class="rpgtitle">' + esc(STR.learnAll) + '</div><div class="stack" style="margin-top:10px">' + list + '</div></div>';

  return '<div class="learnrpg">' + header + mapsSec + queueSec + listSec + '</div>';
}

function renderStageSheet(){

  }).join('') + '<button class="ghostbtn" onclick="closeSheet()">' + esc(STR.cancel) + '</button></div></div>';
}

function renderSyncSheet(){
  if (SYNC && SYNC.enabled) {
    return '<div class="sheetcard"><div class="sheettitle">' + esc(STR.syncRow) + '</div><div class="stack">' +
      '<div class="note"><span data-sync-status>' + esc(syncStatusLabel()) + '</span></div>' +
      '<div class="note">サーバには暗号化済みデータのみ保存（E2E暗号化）。パスフレーズを知らない相手（サーバ運営者含む）は読めません。</div>' +
      '<div class="field"><div class="fieldlabel">アカウント（メール）</div><input class="input" value="' + esc(SYNC.email || "") + '" readonly></div>' +
      (SYNC_STATUS.kind === "reauth" ? '<div class="field"><div class="fieldlabel">パスワード（再ログイン）</div><input class="input" type="password" value="' + esc((SHEET.draft && SHEET.draft.reloginPassword) || "") + '" oninput="sheetTextInput(\'reloginPassword\',this.value)"></div>' : '') +
      '<div class="row wrap"><button class="ghostbtn" onclick="syncNow()">今すぐ同期</button>' +
      (SYNC_STATUS.kind === "reauth" ? '<button class="ghostbtn" onclick="doSyncRelogin()">再ログイン</button>' : '') +
      '<button class="ghostbtn danger" onclick="disableSync()">無効化</button><button class="ghostbtn" onclick="closeSheet()">' + esc(STR.cancel) + '</button></div></div></div>';
  }
  return '<div class="sheetcard"><div class="sheettitle">' + esc(STR.syncRow) + '</div><div class="stack">' +
    '<div class="note">症例データは端末内で暗号化してから送信されます。⚠ パスフレーズを忘れるとサーバ上のデータは誰にも復元できません（端末内データは無事）。</div>' +
    '<div class="field"><div class="fieldlabel">Firebase 設定（コンソールの firebaseConfig を貼り付け）</div><textarea class="input" rows="5" oninput="sheetTextInput(\'firebaseConfig\',this.value)">' + esc((SHEET.draft && SHEET.draft.firebaseConfig) || "") + '</textarea></div>' +
    '<div class="field"><div class="fieldlabel">メールアドレス（同期アカウント）</div><input class="input" value="' + esc((SHEET.draft && SHEET.draft.email) || "") + '" oninput="sheetTextInput(\'email\',this.value)"></div>' +
    '<div class="field"><div class="fieldlabel">パスワード（8文字以上・初回は自動でアカウント作成）</div><input class="input" type="password" value="' + esc((SHEET.draft && SHEET.draft.password) || "") + '" oninput="sheetTextInput(\'password\',this.value)"></div>' +
    '<div class="field"><div class="fieldlabel">暗号化パスフレーズ（8文字以上・全端末で同一・紙に控える）</div><input class="input" type="password" value="' + esc((SHEET.draft && SHEET.draft.passphrase) || "") + '" oninput="sheetTextInput(\'passphrase\',this.value)"></div>' +
    '<div class="field"><div class="fieldlabel">暗号化パスフレーズ（確認）</div><input class="input" type="password" value="' + esc((SHEET.draft && SHEET.draft.passphrase2) || "") + '" oninput="sheetTextInput(\'passphrase2\',this.value)"></div>' +
    '<div class="row wrap"><button class="primary" onclick="doEnableSync()" ' + (SHEET.syncBusy ? 'disabled' : '') + '>有効化</button><button class="ghostbtn" onclick="closeSheet()">' + esc(STR.cancel) + '</button></div></div></div>';
}

function renderDataSheet(){

    '<button class="ghostbtn" onclick="downloadBackup()">' + esc(STR.backupDl) + '</button>' +
