function stageOn(stageLog, date){
  var rows = cloneArr(stageLog).sort(function(a, b){ return String(a.date || "").localeCompare(String(b.date || "")); });
  if (!rows.length) return "";
  var active = rows[0].stageId || "";
  rows.forEach(function(item){
    if (item && item.date <= date && item.stageId) active = item.stageId;
  });
  return active;
}

function buildWeekGrid(cases, todayIso, pastDays, futureDays){
  var base = Date.parse(todayIso + "T00:00:00");
  var past = Number.isFinite(Number(pastDays)) ? Math.max(0, Number(pastDays)) : 7;
  var future = Number.isFinite(Number(futureDays)) ? Math.max(0, Number(futureDays)) : 7;
  var dates = [];
  for (var i = -past; i <= future; i += 1) {
    var d = new Date(base + i * 86400000);
    dates.push(d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"));
  }
  var rows = boardOrder(cases, todayIso).filter(function(c){ return c.status !== "discharged"; }).map(function(c){
    var cells = {};
    var firstStageId = c && c.stageLog && c.stageLog[0] && c.stageLog[0].stageId ? c.stageLog[0].stageId : "";
    var chartItems = cloneArr(c.chart && c.chart.items);
    var overdue = overdueEntries(c, todayIso);
    dates.forEach(function(date){
      var markers = [];
      openPendings(c).forEach(function(item){ if (item && item.backOn === date && date > todayIso) markers.push({ kind:"pending", text:"\u5f85 " + String(item.text || "") }); });
      if (c.discharge && c.discharge.plannedOn === date && date > todayIso) markers.push({ kind:"planned", text:"\u2605" });
      cloneArr(c.todos).forEach(function(item){
        if (!item || item.done) return;
        // Tasks with a scheduled date (due) live on that day and show their
        // content; once due (or dateless), undone ones roll to today's column.
        var visible = date === todayIso
          ? (item.due ? item.due <= todayIso : item.createdOn <= todayIso)
          : (date > todayIso && (item.due ? item.due === date : item.createdOn === date));
        if (visible) markers.push({ kind:"todo", text:(item.time ? item.time + " " : "") + String(item.text || "") });
      });
      var events = [];
      var bands = [];
      var plans = [];
      chartItems.forEach(function(item){
        if (!item) return;
        if (item.kind === "event" && item.date === date) events.push({ id:item.id, catId:item.catId, name:item.name, status:item.status });
        if (item.kind === "band" && bandOnDate(item, date)) bands.push({ id:item.id, catId:item.catId, name:item.name });
        if (item.kind === "value" && isObj(item.planned) && item.planned[date]) {
          plans.push({ id:item.id, catId:item.catId, name:item.name, entered:!!(isObj(item.values) && item.values[date]) });
        }
      });
      var stageId = "";
      if (date >= c.admittedAt && date <= todayIso) stageId = stageOn(c.stageLog, date) || firstStageId;
      cells[date] = {
        stageId:stageId,
        markers:markers,
        events:events,
        bands:bands,
        plans:plans,
        overdue:date === todayIso ? overdue : []
      };
    });
    return { case:c, dates:cells };
  });
  return { dates:dates, rows:rows, today:todayIso };
}

function buildDayPlan(cases, date, todayIso){
  var groups = [];
  boardOrder(cases, todayIso).filter(function(c){ return c.status !== "discharged"; }).forEach(function(c){
    var items = [];
    if (date === todayIso) {
      // Unresolved past plans surface on today until explicitly resolved (MAR).
      overdueEntries(c, todayIso).forEach(function(o){
        items.push({ type:"overdue", id:o.id, text:o.name, kind:o.kind, date:o.date, catId:o.catId });
      });
    }
    // Task visibility mirrors buildWeekGrid: due-dated tasks appear on their
    // day (rolling to today once due), dateless ones live on today.
    cloneArr(c.todos).forEach(function(item){
      if (!item || item.done) return;
      var visible = date === todayIso
        ? (item.due ? item.due <= todayIso : item.createdOn <= todayIso)
        : (date > todayIso && (item.due ? item.due === date : item.createdOn === date));
      if (visible) items.push({ type:"todo", id:String(item.id || ""), text:String(item.text || ""), time:item.time || null, due:item.due || null });
    });
    openPendings(c).forEach(function(item){
      if (item && item.backOn === date) items.push({ type:"pending", id:String(item.id || ""), text:String(item.text || "") });
    });
    cloneArr(c.chart && c.chart.items).forEach(function(item){
      if (!item) return;
      if (item.kind === "event" && item.date === date) {
        items.push({ type:"event", id:item.id, text:item.name, catId:item.catId, status:item.status });
      }
      if (item.kind === "value" && isObj(item.planned) && item.planned[date]) {
        items.push({ type:"valuePlan", id:item.id, text:item.name, catId:item.catId, entered:!!(isObj(item.values) && item.values[date]) });
      }
    });
    if (c.discharge && c.discharge.plannedOn === date) items.push({ type:"discharge", id:"", text:"" });
    // Timed items sort to the top in clock order; untimed keep insertion
    // order below (the overdue block is split off by type at render time).
    var timed = items.filter(function(x){ return x.time; }).sort(function(a, b){ return a.time < b.time ? -1 : a.time > b.time ? 1 : 0; });
    items = timed.concat(items.filter(function(x){ return !x.time; }));
    if (items.length) groups.push({ caseId:c.id, label:c.label, admittedAt:c.admittedAt, stageId:c.stageId, items:items });
  });
  return groups;
}

function searchCases(cases, query, filters){
  var q = String(query || "").trim().toLowerCase();
  var month = filters && filters.month ? filters.month : "";
  var stageId = filters && filters.stageId ? filters.stageId : "";
  return cloneArr(cases).filter(function(c){
    if (month && String(c.admittedAt || "").slice(0, 7) !== month) return false;
    if (stageId && c.stageId !== stageId) return false;
    if (!q) return true;
    var fields = [c.label, c.room, (c.dxTags || []).join(" "), c.phaseNote]
      .concat(cloneArr(c.todos).map(function(x){ return x.text; }))
      .concat(cloneArr(c.pendings).map(function(x){ return x.text; }))
      .concat(cloneArr(c.notes).map(function(x){ return x.text; }));
    return fields.some(function(text){ return String(text || "").toLowerCase().indexOf(q) >= 0; });
  }).map(function(c){
    var fields = [c.label, c.room, (c.dxTags || []).join(" "), c.phaseNote]
      .concat(cloneArr(c.todos).map(function(x){ return x.text; }))
      .concat(cloneArr(c.pendings).map(function(x){ return x.text; }))
      .concat(cloneArr(c.notes).map(function(x){ return x.text; }));
    var hint = q ? (fields.find(function(text){ return String(text || "").toLowerCase().indexOf(q) >= 0; }) || "") : "";
    return { case:c, hint:hint };
  });
}

function moveIdInList(ids, id, direction){
  var from = ids.indexOf(id);
  var to = direction === "up" ? from - 1 : from + 1;
  if (from < 0 || to < 0 || to >= ids.length) return cloneArr(ids);
  var next = cloneArr(ids);
  next.splice(to, 0, next.splice(from, 1)[0]);
  return next;
}

function syncDiffFields(prevCase, currCase){
  var keys = {};
  Object.keys(prevCase || {}).forEach(function(k){ keys[k] = true; });
  Object.keys(currCase || {}).forEach(function(k){ keys[k] = true; });
  var changed = [];
  Object.keys(keys).forEach(function(k){
    if(k === "id"){ return; }
    var a = prevCase ? JSON.stringify(prevCase[k] === undefined ? null : prevCase[k]) : "__none__";
    var b = currCase ? JSON.stringify(currCase[k] === undefined ? null : currCase[k]) : "__none__";
    if(a !== b){ changed.push(k); }
  });
  return changed;
}

function syncMergeCase(localCase, localMt, remoteCase, remoteMt){
  localMt = localMt || {};
  remoteMt = remoteMt || {};
  var merged = JSON.parse(JSON.stringify(localCase));
  var mt = {};
  var keys = {};
  Object.keys(localCase || {}).forEach(function(k){ keys[k] = true; });
  Object.keys(remoteCase || {}).forEach(function(k){ keys[k] = true; });
  var tookRemote = false;
  Object.keys(keys).forEach(function(k){
    if(k === "id"){ return; }
    if(k === "entries"){
      // SPEC-F: entries merge element-wise on per-entry updatedAt, never by the
      // field clock (both devices may edit different elements of this one field).
      merged.entries = mergeEntries(localCase && localCase.entries, remoteCase && remoteCase.entries);
      var elt = localMt[k] || "";
      var ert = remoteMt[k] || "";
      var emax = ert > elt ? ert : elt;
      if(emax){ mt[k] = emax; }
      if(JSON.stringify(localCase && localCase.entries) !== JSON.stringify(merged.entries)){ tookRemote = true; }
      return;
    }
    var lt = localMt[k] || "";
    var rt = remoteMt[k] || "";
    if(rt > lt && (k in (remoteCase || {}))){
      merged[k] = JSON.parse(JSON.stringify(remoteCase[k]));
      mt[k] = rt;
      if(JSON.stringify(localCase && localCase[k]) !== JSON.stringify(remoteCase[k])){ tookRemote = true; }
    }else if(lt){
      mt[k] = lt;
    }
  });
  if(merged.entries !== undefined){
    // Keep the merged case self-consistent BEFORE it is snapshotted: adopt
    // mirror-only additions (old-device pushes), then re-derive the mirrors
    // from entries. Without this every cross-device merge would echo one
    // extra push when normalizeState later rewrites the mirrors.
    var ctx = entryCtx(merged, merged.lastTouchedAt || "", String(merged.lastTouchedAt || "").slice(0, 10));
    entryFoldMirrors(merged, ctx);
    entryRebuildMirrors(merged);
  }
  return { merged:merged, mt:mt, tookRemote:tookRemote };
}

function syncEmptyState(){
  return { snap:{}, mt:{}, dirty:{}, tombstones:{}, restored:{}, configSnap:null, configMt:{}, configDirty:false };
}

function syncMarkRestored(state, id){
  state = state || syncEmptyState();
  if (!id) return state;
  delete state.tombstones[id];
  delete state.snap[id];
  delete state.mt[id];
  // The restored flag is what lets this case survive a remote tombstone in
  // syncReconcile; a case that merely exists locally without the flag must
  // still be deleted when a remote tombstone arrives (normal delete propagation).
  state.restored = state.restored || {};
  state.restored[id] = true;
  state.dirty[id] = true;
  return state;
}

function syncNoteLocalChanges(data, state, nowIso){
  state = state || syncEmptyState();
  var seen = {};
  (data.cases || []).forEach(function(c){
    seen[c.id] = true;
    if(state.tombstones[c.id]){ return; }
    var prevJson = state.snap[c.id];
    var prev = prevJson ? JSON.parse(prevJson) : null;
    var changed = syncDiffFields(prev, c);
    if(changed.length){
      // First snapshot of a case (sync enable / re-enable) is a baseline, not an
      // edit: stamp with the case's own lastTouchedAt so older local data cannot
      // beat newer remote data in the LWW merge. Real edits keep nowIso.
      var stamp = prev ? nowIso : ((typeof c.lastTouchedAt === "string" && c.lastTouchedAt) ? c.lastTouchedAt : nowIso);
      state.mt[c.id] = state.mt[c.id] || {};
      changed.forEach(function(k){ state.mt[c.id][k] = stamp; });
      state.snap[c.id] = JSON.stringify(c);
      state.dirty[c.id] = true;
    }
  });
  Object.keys(state.snap).forEach(function(id){
    if(!seen[id]){
      delete state.snap[id];
      delete state.mt[id];
      if(state.restored) delete state.restored[id];
      // Design session 2026-07-09 decision 3: tombstones carry their deletion
      // time so "delete vs later edit" resolves by newest-wins like everything else.
      state.tombstones[id] = nowIso;
      state.dirty[id] = true;
    }
  });
  var currentConfig = { stages:(data.config && data.config.stages) || [], labels:(data.config && data.config.labels) || {}, chartCats:(data.config && data.config.chartCats) || [] };
  var prevConfig = state.configSnap ? JSON.parse(state.configSnap) : null;
  var mergedCfgMt = state.configMt || {};
  // First config snapshot is a baseline, not an edit: leave mt/dirty untouched so
  // a fresh device's default config never overwrites the server's config.
  // Seeding an empty server is handled in syncReconcileConfig.
  if(prevConfig){
    ["stages", "labels", "chartCats"].forEach(function(k){
      var a = JSON.stringify(prevConfig[k] === undefined ? null : prevConfig[k]);
      var b = JSON.stringify(currentConfig[k] === undefined ? null : currentConfig[k]);
      if(a !== b){
        mergedCfgMt[k] = nowIso;
        state.configDirty = true;
      }
    });
  }
  state.configMt = mergedCfgMt;
  state.configSnap = JSON.stringify(currentConfig);
  return state;
}

function syncReconcile(data, state, remoteList, nowIso){
  state = syncNoteLocalChanges(data, state, nowIso);
  var byId = {};
  (data.cases || []).forEach(function(c){ byId[c.id] = c; });
  var localChanged = false;
  (remoteList || []).forEach(function(r){
    if(r.deleted){
      if(byId[r.id] && state.restored && state.restored[r.id]){
        state.dirty[r.id] = true;
        return;
      }
      // Remote deletion vs local edits: when the tombstone carries a time and
      // any local field edit is NEWER, the case survives and is pushed back
      // (revival). Missing deletedAt = legacy doc = old delete-wins behavior.
      if(byId[r.id] && typeof r.deletedAt === "string" && r.deletedAt){
        var localNewest = "";
        var mtMap = state.mt[r.id] || {};
        Object.keys(mtMap).forEach(function(k){ if(mtMap[k] > localNewest) localNewest = mtMap[k]; });
        if(!localNewest && byId[r.id].lastTouchedAt) localNewest = byId[r.id].lastTouchedAt;
        if(localNewest > r.deletedAt){
          state.dirty[r.id] = true;
          return;
        }
      }
      state.tombstones[r.id] = typeof r.deletedAt === "string" && r.deletedAt ? r.deletedAt : nowIso;
      delete state.dirty[r.id];
      delete state.snap[r.id];
      delete state.mt[r.id];
      if(state.restored) delete state.restored[r.id];
      if(byId[r.id]){
        data.cases = data.cases.filter(function(c){ return c.id !== r.id; });
        delete byId[r.id];
        localChanged = true;
      }
      return;
    }
    if(state.tombstones[r.id]){
      if(state.dirty[r.id]){
        // Local deletion pending push vs a live remote: a remote edit NEWER
        // than our deletion time wins and resurrects the case.
        var delAt = typeof state.tombstones[r.id] === "string" ? state.tombstones[r.id] : "";
        var remoteNewest = "";
        Object.keys(r.mt || {}).forEach(function(k){ if(r.mt[k] > remoteNewest) remoteNewest = r.mt[k]; });
        if(!(delAt && remoteNewest > delAt)){ return; }
        delete state.dirty[r.id];
      }
      delete state.tombstones[r.id];
    }
    var local = byId[r.id];
    if(!local){
      var incoming = normalizeCase(r.case, nowIso, String(nowIso).slice(0, 10));
      incoming.id = r.id;
      data.cases.push(incoming);
      state.snap[r.id] = JSON.stringify(incoming);
      state.mt[r.id] = JSON.parse(JSON.stringify(r.mt || {}));
      delete state.dirty[r.id];
      if(state.restored) delete state.restored[r.id];
      // A non-canonical server doc (older app version) is pushed back once in
      // canonical form so both devices converge on the same serialization.
      if(syncDiffFields(r.case, incoming).length > 0){ state.dirty[r.id] = true; }
      localChanged = true;
      return;
    }
    var res = syncMergeCase(local, state.mt[r.id], r.case, r.mt);
    // Snapshot the NORMALIZED merge result: DB goes through normalizeState right
    // after reconcile, so a raw snapshot would re-detect the normalize delta as
    // a fresh local edit on every sync (phantom now-stamped pushes, and expired
    // entry tombstones re-imported from remote could never finish purging).
    var merged = normalizeCase(res.merged, nowIso, String(nowIso).slice(0, 10));
    merged.id = r.id;
    var mergedJson = JSON.stringify(merged);
    if(mergedJson !== JSON.stringify(local)){
      var idx = data.cases.indexOf(local);
      data.cases[idx] = merged;
      byId[r.id] = merged;
      localChanged = true;
    }
    state.mt[r.id] = res.mt;
    if(syncDiffFields(r.case, merged).length > 0){ state.dirty[r.id] = true; }
    else {
      delete state.dirty[r.id];
      // Reconciled against a live remote copy: the restore flag has served its
      // purpose. Left in place it would override legitimate FUTURE deletions.
      if(state.restored) delete state.restored[r.id];
    }
    state.snap[r.id] = mergedJson;
  });
  var pushes = [];
  Object.keys(state.dirty).forEach(function(id){
    if(state.tombstones[id]){
      pushes.push({ id:id, deleted:true, case:null, mt:null, deletedAt:typeof state.tombstones[id] === "string" ? state.tombstones[id] : null });
    }else if(byId[id]){
      pushes.push({ id:id, deleted:false, case:byId[id], mt:state.mt[id] || {} });
    }
  });
  return { data:data, state:state, pushes:pushes, localChanged:localChanged };
}

function syncClearDirty(state, ids){
  (ids || []).forEach(function(id){
    delete state.dirty[id];
    if(state.restored) delete state.restored[id];
  });
  return state;
}

var subtle = (typeof globalThis !== "undefined" && globalThis.crypto) ? globalThis.crypto.subtle : null;

function b64FromBytes(bytes){
  var bin = "";
  var arr = new Uint8Array(bytes);
  for(var i = 0; i < arr.length; i += 1){ bin += String.fromCharCode(arr[i]); }
  return globalThis.btoa(bin);
}

function bytesFromB64(b64){
  var bin = globalThis.atob(b64);
  var arr = new Uint8Array(bin.length);
  for(var i = 0; i < bin.length; i += 1){ arr[i] = bin.charCodeAt(i); }
  return arr;
}

var PBKDF2_ITER = 310000;

function syncRandomSaltB64(){
  var bytes = new Uint8Array(16);
  globalThis.crypto.getRandomValues(bytes);
  return b64FromBytes(bytes);
}

async function syncDeriveKey(passphrase, saltB64, iter){
  var enc = new TextEncoder();
  var baseKey = await subtle.importKey("raw", enc.encode(passphrase), "PBKDF2", false, ["deriveKey"]);
  return subtle.deriveKey(
    { name:"PBKDF2", salt:bytesFromB64(saltB64), iterations:iter || PBKDF2_ITER, hash:"SHA-256" },
    baseKey,
    { name:"AES-GCM", length:256 },
    true,
    ["encrypt", "decrypt"]
  );
}

async function syncEncryptJson(key, obj){
  var iv = new Uint8Array(12);
  globalThis.crypto.getRandomValues(iv);
  var enc = new TextEncoder();
  var cipher = await subtle.encrypt({ name:"AES-GCM", iv:iv }, key, enc.encode(JSON.stringify(obj)));
  return { iv:b64FromBytes(iv), blob:b64FromBytes(cipher) };
}

async function syncDecryptJson(key, blobB64, ivB64){
  var plain = await subtle.decrypt({ name:"AES-GCM", iv:bytesFromB64(ivB64) }, key, bytesFromB64(blobB64));
  return JSON.parse(new TextDecoder().decode(plain));
}

function syncConfigPlain(data){
  return {
    config:{
      stages:cloneArr(data && data.config && data.config.stages).map(function(x){ return JSON.parse(JSON.stringify(x)); }),
      labels:JSON.parse(JSON.stringify((data && data.config && data.config.labels) || {})),
      chartCats:cloneArr(data && data.config && data.config.chartCats).map(function(x){ return JSON.parse(JSON.stringify(x)); })
    },
    mt:JSON.parse(JSON.stringify((data && data._configMt) || {}))
  };
}

function syncReconcileConfig(data, state, remoteDoc, nowIso){
  state = state || syncEmptyState();
  if(!remoteDoc || !remoteDoc.config){
    // Server has no config yet: seed it from this device. Stamping happens here
    // (not at baseline time) because only an empty server may take unstamped local config.
    if(nowIso){
      var cfgMt = state.configMt || {};
      var seeded = false;
      ["stages", "labels", "chartCats"].forEach(function(k){
        if(!cfgMt[k]){ cfgMt[k] = nowIso; seeded = true; }
      });
      state.configMt = cfgMt;
      if(seeded){ state.configDirty = true; }
      data._configMt = JSON.parse(JSON.stringify(cfgMt));
    }
    return { data:data, state:state, localChanged:false, push:!!state.configDirty };
  }
  var localCfg = { stages:data.config.stages, labels:data.config.labels, chartCats:data.config.chartCats };
  var res = syncMergeCase(localCfg, state.configMt || {}, remoteDoc.config, remoteDoc.mt || {});
  var changed = JSON.stringify(res.merged) !== JSON.stringify(localCfg);
  if(changed){
    data.config.stages = cloneArr(res.merged.stages);
    data.config.labels = JSON.parse(JSON.stringify(res.merged.labels || {}));
    data.config.chartCats = cloneArr(res.merged.chartCats);
  }
  state.configMt = res.mt;
  state.configSnap = JSON.stringify({ stages:data.config.stages, labels:data.config.labels, chartCats:data.config.chartCats });
  state.configDirty = syncDiffFields(remoteDoc.config, res.merged).length > 0;
  data._configMt = JSON.parse(JSON.stringify(res.mt));
  return { data:data, state:state, localChanged:changed, push:!!state.configDirty };
}

function syncClearConfigDirty(state){
  state.configDirty = false;
  return state;
}

function statsSummary(stats){
  var src = isObj(stats) ? stats : {};
  var opened = isObj(src.openedDays) ? Object.keys(src.openedDays).length : 0;
  return {
    openedDays:opened,
    reviewsDone:toNum(src.reviewsDone, 0),
    seedsCaptured:toNum(src.seedsCaptured, 0),
    exportsDone:toNum(src.exportsDone, 0)
  };
}

function buildOutboxBatch(cases, todayIso, batchId, stats){
  var seeds = [];
  cloneArr(cases).forEach(function(c){
    cloneArr(c && c.seeds).forEach(function(seed){
      if(seed && seed.sentAt == null){
        seeds.push({
          seedId:seed.id,
          caseId:c.id,
          text:seed.text,
          createdOn:seed.createdOn || todayIso,
          snapshot:JSON.parse(JSON.stringify(seed.snapshot || {}))
        });
      }
    });
  });
  return {
    batchId:batchId,
    date:todayIso,
    seeds:seeds,
    stats:statsSummary(stats)
  };
}

function fmtMonthDay(date){
  return Number(String(date).slice(5, 7)) + "/" + Number(String(date).slice(8, 10));
}

// 経過表 (temperature board) as AI-readable text: a compact 項目 x 日付 table
// for entered values, plus one line each for bands (periods) and events (dated).
// Pure: caller passes the category list and today's ISO date.
// No in-app caller since the day export was removed (2026-07-25); kept (with
// its tests) because 経過表 Phase 2 feeds this into the AI feedback payload.
function chartExportLines(c, cats, today){
  var groups = chartRowsForCase(c, cats).filter(function(g){ return g.items.length; });
  if (!groups.length) return [];
  var valueItems = [];
  var dateSet = {};
  groups.forEach(function(g){
    g.items.forEach(function(it){
      if (it.kind === "value" && isObj(it.values)) {
        var ds = Object.keys(it.values).filter(function(d){ return it.values[d] !== "" && it.values[d] != null; });
        if (ds.length) { valueItems.push(it); ds.forEach(function(d){ dateSet[d] = true; }); }
      }
    });
  });
  var dates = Object.keys(dateSet).sort();
  if (dates.length > 14) dates = dates.slice(dates.length - 14);
  var lines = ["", "## 経過表"];
  if (valueItems.length && dates.length) {
    lines.push("| 項目 | " + dates.map(fmtMonthDay).join(" | ") + " |");
    lines.push("|---|" + dates.map(function(){ return "---"; }).join("|") + "|");
    valueItems.forEach(function(it){
      lines.push("| " + (it.name || "-") + " | " + dates.map(function(d){
        var val = it.values[d];
        return (val != null && val !== "") ? String(val) : "";
      }).join(" | ") + " |");
    });
  }
  var extras = [];
  groups.forEach(function(g){
    var prefix = g.cat && g.cat.name ? g.cat.name + "／" : "";
    g.items.forEach(function(it){
      if (it.kind === "band" && it.startDate) {
        extras.push("- " + prefix + (it.name || "-") + "（帯）: " + fmtMonthDay(it.startDate) + "〜" + (it.endDate ? fmtMonthDay(it.endDate) : ""));
      }
      if (it.kind === "event" && it.date) {
        var mark = it.status === "done" ? " ✓" : (it.date < today ? " ⚠未" : " 予定");
        extras.push("- " + prefix + (it.name || "-") + ": " + fmtMonthDay(it.date) + mark);
      }
    });
  });
  if (extras.length) { lines.push(""); lines = lines.concat(extras); }
  return lines;
}

// ---- chart quick entry (2026-07-21 CEO壁打ち) -------------------------------
// The old path was one sheet per item x date (openChartValue), so a 6-item day
// cost ~18 taps, and the table had to double as the input surface - which is
// also why cells stayed finger-sized and the numbers too small to read. Both
// complaints share that one cause, so input leaves the table: a line of text is
// parsed into the day's values, shown in a vertical form, saved once.
//
// Deliberately absent from the alias table: anything that reads two ways. "T"
// is 体温 or T-Bil depending on who wrote it, and a silently wrong row here
// becomes a wrong dose later. Unresolved names land in `unknown` for the user
// to place; nothing is ever guessed.
var CHART_ALIASES = {
  bt:"体温", kt:"体温", temp:"体温",
  hr:"脈拍", pr:"脈拍",
  bp:"血圧",
  spo2:"SpO2", sat:"SpO2",
  rr:"呼吸数",
  wbc:"WBC", crp:"CRP", hb:"Hb", plt:"Plt", na:"Na", k:"K",
  bun:"BUN", cr:"Cr", cre:"Cr", alb:"Alb", ast:"AST", alt:"ALT", egfr:"eGFR"
};

// A name glued to its number ("BT37.2") is ambiguous against names that carry
// digits themselves ("SpO2"), so a separator is required. Colons, equals signs
// and the full-width forms all count as one.
function chartDayTokens(text){
  return String(text == null ? "" : text)
    .replace(/[　]/g, " ")
    .replace(/[,，:：=＝／]/g, " ")
    .split(/\s+/)
    .filter(function(tok){ return tok; });
}

function chartValueToken(tok){
  return /^[<>＜＞]?[0-9]/.test(tok);
}

function chartDayParse(text, items){
  var rows = (items || []).filter(function(it){ return it && it.kind === "value" && it.name; });
  var byName = {};
  rows.forEach(function(it){ byName[String(it.name).trim().toLowerCase()] = it; });
  var matched = [];
  var unknown = [];
  var pending = null;
  function dropPending(){
    if (pending) unknown.push({ name:pending, value:"", suggest:CHART_ALIASES[pending.toLowerCase()] || pending });
    pending = null;
  }
  chartDayTokens(text).forEach(function(tok){
    if (!chartValueToken(tok)) { dropPending(); pending = tok; return; }
    if (!pending) { unknown.push({ name:"", value:tok, suggest:"" }); return; }
    var key = pending.toLowerCase();
    var hit = byName[key];
    if (!hit && CHART_ALIASES[key]) hit = byName[String(CHART_ALIASES[key]).toLowerCase()];
    if (!hit) {
      var pre = rows.filter(function(it){ return String(it.name).toLowerCase().indexOf(key) === 0; });
      if (pre.length === 1) hit = pre[0];
    }
    if (hit) matched.push({ itemId:hit.id, name:hit.name, value:tok });
    else unknown.push({ name:pending, value:tok, suggest:CHART_ALIASES[key] || pending });
    pending = null;
  });
  dropPending();
  return { matched:matched, unknown:unknown };
}

// ---- renal function calculators -------------------------------------------
// Formulas verified by 1_MKM on 2026-07-22 against 腎疾患マニュアル 第2版
// (糸球体濾過量 節). Do not edit either constant without a fresh MKM review —
// a wrong coefficient here becomes a wrong dose at the bedside.
//
//   CCr  (Cockcroft-Gault) = this patient's own mL/min  -> USE FOR DOSING
//   eGFR (Japanese Cr eq.) = mL/min/1.73m2, BSA-normalised -> CKD staging ONLY
//
// The bounds below are input-typo guards, NOT medical thresholds: 1_MKM stated
// no established cut-offs exist (answer B-3). Ages under CALC_ADULT_MIN_AGE
// still compute — CEO decided 2026-07-22 to warn rather than refuse.
var CALC_LIMITS = {
  ageMin:1, ageMax:120, weightMin:20, weightMax:200, crMin:0.1, crMax:20,
  bunMin:1, bunMax:200, spo2Min:50, spo2Max:100, sbpMin:40, sbpMax:300,
  rrMin:4, rrMax:80, dbpMin:20, dbpMax:200,
  tbilMin:0.1, tbilMax:50, albMin:0.5, albMax:6.5, ptPctMin:5, ptPctMax:150, inrMin:0.5, inrMax:10,
  astMin:1, astMax:3000, altMin:1, altMax:3000, pltMin:0.1, pltMax:150, bmiMin:10, bmiMax:60
};
var CALC_ADULT_MIN_AGE = 18;

function calcNum(value){
  if (typeof value === "number") return isFinite(value) ? value : null;
  var text = String(value == null ? "" : value).trim();
  if (!text) return null;
  var n = Number(text);
  return isFinite(n) ? n : null;
}

function calcInRange(n, min, max){
  return n !== null && n >= min && n <= max;
}

// Every input must clear its guard before anything is returned: a partially
// filled sheet shows "not enough input", never a number computed from a blank.
function calcCcr(age, sex, weightKg, cr){
  var a = calcNum(age), w = calcNum(weightKg), s = calcNum(cr);
  if (!calcInRange(a, CALC_LIMITS.ageMin, CALC_LIMITS.ageMax)) return null;
  if (!calcInRange(w, CALC_LIMITS.weightMin, CALC_LIMITS.weightMax)) return null;
  if (!calcInRange(s, CALC_LIMITS.crMin, CALC_LIMITS.crMax)) return null;
  var v = (140 - a) * w / (72 * s);
  if (sex === "F") v = v * 0.85;
  return v > 0 ? v : null;
}

function calcEgfr(age, sex, cr){
  var a = calcNum(age), s = calcNum(cr);
  if (!calcInRange(a, CALC_LIMITS.ageMin, CALC_LIMITS.ageMax)) return null;
  if (!calcInRange(s, CALC_LIMITS.crMin, CALC_LIMITS.crMax)) return null;
  var v = 194 * Math.pow(s, -1.094) * Math.pow(a, -0.287);
  if (sex === "F") v = v * 0.739;
  return v > 0 ? v : null;
}

// One decimal place — 1_MKM: finer digits carry no clinical meaning.
function calcRound1(value){
  return value === null ? null : Math.round(value * 10) / 10;
}
// FIB-4 is the exception: 1_MKM's fixtures are two-decimal (2.83, not 2.8),
// because the value sits on a 1.3/2.67 scale where the second digit moves the
// reading. Declared per result so nothing else silently gains precision.
function calcRound2(value){
  return value === null ? null : Math.round(value * 100) / 100;
}

// ---- A-DROP (community-acquired pneumonia severity) -----------------------
// 1_MKM-verified 2026-07-22 against 成人肺炎診療ガイドライン2024 p.31 表1.
// Every cut-off below is "or more / or less" — the boundary value COUNTS, which
// is the opposite of CURB-65's systolic rule. CURB-65 was ruled out by 1_MKM
// (no primary source for a BUN mg/dL threshold, no Japanese band definition),
// so the two are never shown side by side and cannot be confused.
//
// Nothing is scored from a blank: every one of the five items must be
// determinable or the whole score returns null. A missing SpO2 silently
// counting as "normal" would under-score a patient who is in fact severe.
function calcAdropItems(v){
  var vals = v || {};
  var sex = vals.sex || "";
  var age = calcNum(vals.age), sbp = calcNum(vals.sbp), spo2 = calcNum(vals.spo2), bun = calcNum(vals.bun);
  var dehydration = vals.dehydration, orientation = vals.orientation, shock = vals.shock;
  if (!sex) return null;
  if (!calcInRange(age, CALC_LIMITS.ageMin, CALC_LIMITS.ageMax)) return null;
  if (!calcInRange(sbp, CALC_LIMITS.sbpMin, CALC_LIMITS.sbpMax)) return null;
  if (!calcInRange(spo2, CALC_LIMITS.spo2Min, CALC_LIMITS.spo2Max)) return null;
  if (orientation !== true && orientation !== false) return null;
  if (shock !== true && shock !== false) return null;          // 1_MKM: this input is mandatory
  if (dehydration !== true && dehydration !== false) return null;
  // D は「BUN 21 mg/dL 以上 または 脱水あり」。脱水ありなら BUN は不要。
  if (dehydration !== true && !calcInRange(bun, CALC_LIMITS.bunMin, CALC_LIMITS.bunMax)) return null;
  return {
    a:(sex === "M" && age >= 70) || (sex === "F" && age >= 75) ? 1 : 0,
    d:(dehydration === true || (bun !== null && bun >= 21)) ? 1 : 0,
    r:spo2 <= 90 ? 1 : 0,
    o:orientation === true ? 1 : 0,
    p:sbp <= 90 ? 1 : 0
  };
}

function calcAdrop(v){
  var items = calcAdropItems(v);
  if (!items) return null;
  return items.a + items.d + items.r + items.o + items.p;
}

// GL2024 逐語:「ただし，敗血症性ショックがあれば１項目のみでも超重症とする」。
// The guideline defines the exception for 1 or more items; it says nothing
// about septic shock with zero items, so nothing is invented for that case —
// the shock note is shown on screen either way.
function calcAdropBandKey(v){
  var n = calcAdrop(v);
  if (n === null) return "";
  if ((v || {}).shock === true && n >= 1) return "calcAdropB4";
  if (n === 0) return "calcAdropB1";
  if (n <= 2) return "calcAdropB2";
  if (n === 3) return "calcAdropB3";
  return "calcAdropB4";
}

// ---- CURB-65 (community-acquired pneumonia severity, UK) ------------------
// 1_MKM ruled this out on 2026-07-22 and re-supervised it on 2026-07-29
// (監修依頼 §10-2) once the goal became replacing HOKUTO, i.e. every score has
// to be here. It is allowed under three conditions, all of them implemented:
//
//  1. The urea item is scored as "BUN > 20 mg/dL" (CEO decision 2026-07-29,
//     監修依頼 §10-2① as revised). Source: 黒田浩一「市中肺炎（入院治療編）」
//     U-IDEO 2026;10(4):619 表7 — a published source that states the cut-off in
//     mg/dL, which is what Japanese labs report. Strictly greater: 20.0 exactly
//     does NOT count. The earlier build (2026-07-22..2026-07-29) instead kept
//     the verbatim "urea > 7 mmol/l" and divided BUN by 2.8014; that path is
//     gone. Because 20 is a rounding of 7 mmol/l (= BUN ~19.6 mg/dL), the
//     formula line must keep saying so — 1_MKM requires that caveat to stay
//     visible so the number is not read as a mg/dL cut-off defined by a
//     guideline. Patients with BUN 19.7-20.0 now score one point lower.
//  2. Bands carry NICE's mortality risk only. NG250's care settings (virtual
//     ward / SDEC unit / hospital at home) assume the UK system, so they are
//     omitted — exactly as A-DROP's 外来/一般病棟/ICU is omitted.
//  3. A-DROP and CURB-65 disagree on three points (systolic 90 exactly, the
//     age rule, respiratory rate vs SpO2). The disagreement is displayed
//     rather than hidden: the two are separate tools and never merged, and
//     no ○× flag is shared between them (only raw values like age and sbp).
//
// As with A-DROP nothing is scored from a blank: one undetermined item makes
// the whole score null. Note the boundaries run the OPPOSITE way to A-DROP —
// systolic 90 exactly does NOT count here but does count in A-DROP.
var CURB65_BUN_CUTOFF = 20;   // BUN [mg/dL], strictly greater (20.0 does not count)

function calcCurb65Items(v){
  var vals = v || {};
  var age = calcNum(vals.age), rr = calcNum(vals.rr);
  var sbp = calcNum(vals.sbp), dbp = calcNum(vals.dbp);
  var confusion = vals.confusion;
  if (!calcInRange(age, CALC_LIMITS.ageMin, CALC_LIMITS.ageMax)) return null;
  if (confusion !== true && confusion !== false) return null;
  if (!calcInRange(calcNum(vals.bun), CALC_LIMITS.bunMin, CALC_LIMITS.bunMax)) return null;
  if (!calcInRange(rr, CALC_LIMITS.rrMin, CALC_LIMITS.rrMax)) return null;
  if (!calcInRange(sbp, CALC_LIMITS.sbpMin, CALC_LIMITS.sbpMax)) return null;
  if (!calcInRange(dbp, CALC_LIMITS.dbpMin, CALC_LIMITS.dbpMax)) return null;
  var bun = calcNum(vals.bun);
  return {
    c:confusion === true ? 1 : 0,
    u:bun > CURB65_BUN_CUTOFF ? 1 : 0,        // strictly greater — 20.0 does NOT count
    r:rr >= 30 ? 1 : 0,                       // 30 counts
    b:(sbp < 90 || dbp <= 60) ? 1 : 0,        // systolic 90 does NOT count; diastolic 60 does
    age65:age >= 65 ? 1 : 0                   // 65 counts
  };
}

function calcCurb65(v){
  var items = calcCurb65Items(v);
  if (!items) return null;
  return items.c + items.u + items.r + items.b + items.age65;
}

// NICE NG250 verbatim: 0 or 1 low (<3%), 2 intermediate (3-15%), 3 to 5 high
// (>15%). Mortality percentages travel across health systems; care settings do
// not, so only these three bands exist here.
function calcCurb65BandKey(v){
  var n = calcCurb65(v);
  if (n === null) return "";
  if (n <= 1) return "calcCurbB1";
  if (n === 2) return "calcCurbB2";
  return "calcCurbB3";
}

// ---- Child-Pugh (liver cirrhosis severity) --------------------------------
// 1_MKM-verified 2026-07-29 against 肝硬変診療ガイドライン2020（改訂第3版）
// p.141 表1 (still the newest freely published edition; the 4th is due but
// unreleased). FIVE items, not six: PT activity (%) and INR are ONE item and
// are entered exclusively. The Vault note used to list them as separate rows,
// which would top out at 18 points and break the A/B/C bands entirely — that
// note was corrected the same day.
//
// Boundary values all land on 2 points. The guideline never says so in words;
// it follows from the three bands being complementary (1 = "under 2.0",
// 3 = "over 3.0", so 2.0-3.0 inclusive is what is left).
function calcCpGrade(g){
  var n = calcNum(g);
  if (n === null) return null;
  n = Math.round(n);
  return (n >= 1 && n <= 3) ? n : null;
}

function calcChildPughItems(v){
  var vals = v || {};
  var enc = calcCpGrade(vals.cpEnceph), asc = calcCpGrade(vals.cpAscites);
  var tbil = calcNum(vals.tbil), alb = calcNum(vals.alb);
  var pt = calcNum(vals.ptPct), inr = calcNum(vals.inr);
  var pbc = vals.cpPbc;
  if (enc === null || asc === null) return null;
  if (pbc !== true && pbc !== false) return null;
  if (!calcInRange(tbil, CALC_LIMITS.tbilMin, CALC_LIMITS.tbilMax)) return null;
  if (!calcInRange(alb, CALC_LIMITS.albMin, CALC_LIMITS.albMax)) return null;
  // Exactly one of PT% / INR. Neither -> nothing to score; both -> refuse,
  // because silently picking one is how a coagulation item gets counted twice.
  var hasPt = calcInRange(pt, CALC_LIMITS.ptPctMin, CALC_LIMITS.ptPctMax);
  var hasInr = calcInRange(inr, CALC_LIMITS.inrMin, CALC_LIMITS.inrMax);
  if (hasPt === hasInr) return null;
  var bil;
  if (pbc === true) bil = tbil < 4 ? 1 : (tbil < 10 ? 2 : 3);   // 胆汁うっ滞（PBC）
  else bil = tbil < 2 ? 1 : (tbil <= 3 ? 2 : 3);
  return {
    enceph:enc,
    ascites:asc,
    bil:bil,
    alb:alb > 3.5 ? 1 : (alb >= 2.8 ? 2 : 3),
    coag:hasPt ? (pt > 70 ? 1 : (pt >= 40 ? 2 : 3)) : (inr < 1.7 ? 1 : (inr <= 2.3 ? 2 : 3))
  };
}

function calcChildPugh(v){
  var it = calcChildPughItems(v);
  if (!it) return null;
  return it.enceph + it.ascites + it.bil + it.alb + it.coag;
}

// GL2020 p.141: class A 5-6 / B 7-9 / C 10-15. Five items of 1 point each is
// the floor, so a normal liver still scores 5 — never 0.
function calcChildPughBandKey(v){
  var n = calcChildPugh(v);
  if (n === null) return "";
  if (n <= 6) return "calcCpA";
  if (n <= 9) return "calcCpB";
  return "calcCpC";
}

// True when both coagulation boxes are filled — drives the on-screen warning.
function calcCpBothCoag(v){
  var vals = v || {};
  return calcInRange(calcNum(vals.ptPct), CALC_LIMITS.ptPctMin, CALC_LIMITS.ptPctMax) &&
         calcInRange(calcNum(vals.inr), CALC_LIMITS.inrMin, CALC_LIMITS.inrMax);
}

// ---- FIB-4 index (liver fibrosis screening) -------------------------------
// (age x AST) / (platelets[x10^9/L] x sqrt(ALT)), NAFLD/NASH GL2020 p.31 表1.
// Japanese labs report platelets in 万/uL, so the input is multiplied by 10.
// Miss that and every FIB-4 is ten times too large — the single most likely
// bug here, pinned by its own regression test.
//
// No band. 1_MKM 2026-07-29: NAFLD/NASH GL2020 was superseded by MASLD
// 診療ガイドライン2026 (published 2026-04-01, members-only, no free PDF), and
// secondary sources show the referral cut-off now carries an age condition
// ("65歳以下"). Printing the 2020 bands would present a superseded standard as
// current, so only the number ships until the verbatim text can be read.
var FIB4_PLT_PER_MAN = 10;   // 万/uL -> x10^9/L

function calcFib4(v){
  var vals = v || {};
  var age = calcNum(vals.age), ast = calcNum(vals.ast), alt = calcNum(vals.alt), plt = calcNum(vals.plt);
  if (!calcInRange(age, CALC_LIMITS.ageMin, CALC_LIMITS.ageMax)) return null;
  if (!calcInRange(ast, CALC_LIMITS.astMin, CALC_LIMITS.astMax)) return null;
  if (!calcInRange(alt, CALC_LIMITS.altMin, CALC_LIMITS.altMax)) return null;
  if (!calcInRange(plt, CALC_LIMITS.pltMin, CALC_LIMITS.pltMax)) return null;
  var out = (age * ast) / ((plt * FIB4_PLT_PER_MAN) * Math.sqrt(alt));
  return out > 0 ? out : null;
}

// ---- atrial fibrillation: CHADS2 / CHA2DS2-VASc / HAS-BLED / HELT-E2S2 ----
// 1_MKM-verified 2026-07-29 against JCS/JHRS 2020 (Tables 29/30/31/34) and the
// 2024 Focused Update (Tables 18/19).
//
// THE RULE THAT SHAPES ALL FOUR: no ○× flag is ever shared between scores.
// JCS2020 says so verbatim — "the definitions of risk factors in the HAS-BLED
// score differ from those in the CHADS2 score" — and the differences are real:
// hypertension is >=140/90-or-treated in CHADS2 but uncontrolled >160 systolic
// in HAS-BLED; age is >=75 (2 points) in VASc but >65 (1 point) in HAS-BLED,
// so 65 exactly splits them; stroke includes TIA/systemic embolism in VASc but
// is plain "Stroke" in HAS-BLED. One shared checkbox would silently corrupt
// one of the two. Only raw values (age, sex) are shared.
function calcAllBool(list){
  for (var i = 0; i < list.length; i++) if (list[i] !== true && list[i] !== false) return false;
  return true;
}

function calcChads2Items(v){
  var vals = v || {};
  var age = calcNum(vals.age);
  if (!calcInRange(age, CALC_LIMITS.ageMin, CALC_LIMITS.ageMax)) return null;
  if (!calcAllBool([vals.chadsChf, vals.chadsHt, vals.chadsDm, vals.chadsStroke])) return null;
  return {
    c:vals.chadsChf ? 1 : 0,
    h:vals.chadsHt ? 1 : 0,
    a:age >= 75 ? 1 : 0,
    d:vals.chadsDm ? 1 : 0,
    s2:vals.chadsStroke ? 2 : 0
  };
}
function calcChads2(v){
  var it = calcChads2Items(v);
  if (!it) return null;
  return it.c + it.h + it.a + it.d + it.s2;
}
// Japan's actual starting rule: JCS/JHRS 2020 Figure 12 "Score: >=1 -> DOAC",
// re-affirmed unchanged by the 2024 Focused Update.
function calcChads2BandKey(v){
  var n = calcChads2(v);
  if (n === null) return "";
  return n >= 1 ? "calcChadsB1" : "calcChadsB0";
}

function calcVascItems(v){
  var vals = v || {};
  var age = calcNum(vals.age), sex = vals.sex || "";
  if (!sex) return null;
  if (!calcInRange(age, CALC_LIMITS.ageMin, CALC_LIMITS.ageMax)) return null;
  if (!calcAllBool([vals.vascChf, vals.vascHt, vals.vascDm, vals.vascStroke, vals.vascVd])) return null;
  return {
    c:vals.vascChf ? 1 : 0,
    h:vals.vascHt ? 1 : 0,
    a2:age >= 75 ? 2 : 0,
    d:vals.vascDm ? 1 : 0,
    s2:vals.vascStroke ? 2 : 0,
    vd:vals.vascVd ? 1 : 0,
    a:(age >= 65 && age <= 74) ? 1 : 0,   // exclusive with a2 — max stays 9
    sc:sex === "F" ? 1 : 0
  };
}
function calcVasc(v){
  var it = calcVascItems(v);
  if (!it) return null;
  return it.c + it.h + it.a2 + it.d + it.s2 + it.vd + it.a + it.sc;
}
// The ONLY interpretation 1_MKM allows: JCS2020 §3.1.1e verbatim, "anticoagulation
// therapy is not needed for patients with a CHA2DS2-VASc score of 0, except for
// females". Any other score gets a number and no words — in Japan this score was
// downgraded to IIb in 2024 and is not the starting criterion. (A female always
// scores Sc=1, so a 0 is by construction male.)
function calcVascBandKey(v){
  var n = calcVasc(v);
  if (n === null) return "";
  return n === 0 ? "calcVascB0" : "";
}

function calcHasbledItems(v){
  var vals = v || {};
  var age = calcNum(vals.age);
  if (!calcInRange(age, CALC_LIMITS.ageMin, CALC_LIMITS.ageMax)) return null;
  if (!calcAllBool([vals.hbHt, vals.hbRenal, vals.hbLiver, vals.hbStroke, vals.hbBleed, vals.hbInr, vals.hbDrug, vals.hbAlcohol])) return null;
  return {
    h:vals.hbHt ? 1 : 0,
    a:(vals.hbRenal ? 1 : 0) + (vals.hbLiver ? 1 : 0),
    s:vals.hbStroke ? 1 : 0,
    b:vals.hbBleed ? 1 : 0,
    l:vals.hbInr ? 1 : 0,
    e:age > 65 ? 1 : 0,                    // strictly over 65 — VASc counts 65
    d:(vals.hbDrug ? 1 : 0) + (vals.hbAlcohol ? 1 : 0)
  };
}
function calcHasbled(v){
  var it = calcHasbledItems(v);
  if (!it) return null;
  return it.h + it.a + it.s + it.b + it.l + it.e + it.d;
}
// >=3 is "high bleeding risk" in JCS2020 and ESC 2024 alike. Neither turns that
// into a reason to withhold anticoagulation, and 1_MKM forbids implying it:
// the same patient is also at high thromboembolic risk, so a "consider stopping"
// reading would push care the harmful way. The band text stays at "address
// modifiable factors / follow up sooner and more often".
function calcHasbledBandKey(v){
  var n = calcHasbled(v);
  if (n === null) return "";
  return n >= 3 ? "calcHbB3" : "calcHbB0";
}

function calcHeltItems(v){
  var vals = v || {};
  var age = calcNum(vals.age), bmi = calcNum(vals.bmi);
  if (!calcInRange(age, CALC_LIMITS.ageMin, CALC_LIMITS.ageMax)) return null;
  if (!calcInRange(bmi, CALC_LIMITS.bmiMin, CALC_LIMITS.bmiMax)) return null;
  if (!calcAllBool([vals.heltHt, vals.heltAfType, vals.heltStroke])) return null;
  return {
    h:vals.heltHt ? 1 : 0,
    e:(age >= 75 && age <= 84) ? 1 : 0,
    l:bmi < 18.5 ? 1 : 0,
    t:vals.heltAfType ? 1 : 0,
    e2:age >= 85 ? 2 : 0,                  // exclusive with e — max stays 7
    s2:vals.heltStroke ? 2 : 0
  };
}
function calcHelt(v){
  var it = calcHeltItems(v);
  if (!it) return null;
  return it.h + it.e + it.l + it.t + it.e2 + it.s2;
}
// No band, deliberately. JCS2024 verbatim: "Challenges remain in using the
// HELT-E2S2 score for initiating anticoagulation therapy" — the guideline that
// introduced it says its own threshold is unsettled, so none is invented here.

function calcToolById(id){
  for (var i = 0; i < CALC_TOOLS.length; i++) if (CALC_TOOLS[i].id === id) return CALC_TOOLS[i];
  return null;
}

// Results are always derived from the values in hand — nothing is cached and
// nothing is saved, so a stale input can never leave a stale-looking answer.
function calcCollect(tool, values){
  var vals = values || {};
  return tool.results.map(function(r){
    return {
      key:r.key, main:!!r.main, labelKey:r.labelKey, unitKey:r.unitKey,
      useKey:r.useKey, formulaKey:r.formulaKey,
      value:(r.round === 2 ? calcRound2 : calcRound1)(r.run(vals)),
      bandKey:r.band ? r.band(vals) : ""
    };
  });
}

function calcWarnKeys(tool, values){
  var vals = values || {};
  var out = [];
  (tool.warns || []).forEach(function(w){ if (w.when(vals)) out.push(w.msgKey); });
  return out;
}

// ---- learning conquest maps (cross-case AI feedback) ----------------------
// The 学び tab turns every saved AI-feedback item (kind:"ai") into territory on
// two fixed maps. Nothing new is stored: each item grows its own field/domain/
// mastered annotations and the maps are derived, so the collection survives a
// case being discharged (discharged cases stay in DB.cases; only a hard delete
// removes its share). Territory is "controlled" only once every learning in a
// domain is mastered — collecting alone widens the frontier, it does not conquer.
// CEO 2026-07-27 accepted the 16領域 map duplicating the Vault portfolio hub.
// All pure -> stats/streaks/badges tested without a DOM.
// Design note: 5_開発部/設計/Wardbook_学習の征服マップ.md

// Map 1: organ/system fields (internal-medicine J-OSLER, 13). The names double
// as ids: the AI tags with a name and we store the matched name.
var ORGAN_FIELDS = ["総合内科", "消化器", "循環器", "内分泌", "代謝", "腎臓", "呼吸器", "血液", "神経", "アレルギー", "膠原病", "感染症", "救急"];
// Map 2: family-medicine competencies (16), 1-indexed to match the portfolio hub.
var PF_DOMAINS = [
  "未分化な健康問題", "予防医学と健康増進", "慢性疾患のケア", "長期的な全人的関係に基づくケア",
  "患者中心の医療", "家族志向のケア", "地域志向のプライマリ・ケア", "障害とリハビリテーション",
  "EBMの実践", "メンタルヘルス", "SDH・アドボカシー", "複雑困難・多疾患併存",
  "チーム医療・移行", "プロフェッショナリズム・倫理", "セクシャルヘルス・思春期", "緩和・人生の最終段階"
];

// Coerce a stored/typed tag to a canonical value ("" / 0 = uncategorised).
function canonOrganField(raw){
  var v = String(raw == null ? "" : raw).trim();
  if (!v) return "";
  for (var i = 0; i < ORGAN_FIELDS.length; i++) if (v.indexOf(ORGAN_FIELDS[i]) !== -1) return ORGAN_FIELDS[i];
  return "";
}
function canonPfDomain(raw){
  var n = Math.floor(Number(raw));
  return isFinite(n) && n >= 1 && n <= 16 ? n : 0;
}
// One tag line each, found anywhere in the AI text (position-independent).
function learnFieldFromText(text){
  var m = String(text || "").match(/^\s*分野[:：]\s*(.+)$/m);
  return m ? canonOrganField(m[1]) : "";
}
function learnDomainFromText(text){
  var m = String(text || "").match(/^\s*領域[:：]\s*(.+)$/m);
  if (!m) return 0;
  var s = m[1];
  if (/なし|無し|該当なし/.test(s)) return 0;
  for (var i = 0; i < PF_DOMAINS.length; i++) if (s.indexOf(PF_DOMAINS[i]) !== -1) return i + 1;
  return 0;
}

// Province (disease-group) subdivision of each organ system — 素案 (2026-07-27,
// 細粒度: CEO決定). Aligned to the J-OSLER 13領域 structure, but the authoritative
// 疾患群 names live in the J-OSLER search master, so this is a DRAFT for the
// doctor to confirm (design note). Data only: renaming or moving a province is a
// one-line edit here. id = "system/name" (content-based, so reordering is safe).
var PROVINCE_SRC = {
  "総合内科": ["不明熱", "高齢者総合評価", "中毒・環境", "全身性・多臓器", "症候未分化"],
  "消化器": ["食道", "胃・十二指腸", "小腸・大腸", "炎症性腸疾患", "肝臓", "胆道", "膵臓", "腹膜・腸間膜"],
  "循環器": ["虚血性心疾患", "心不全", "不整脈", "弁膜症", "心筋・心膜疾患", "大動脈・末梢血管", "静脈血栓塞栓", "高血圧"],
  "内分泌": ["下垂体・視床下部", "甲状腺", "副腎", "骨・カルシウム代謝"],
  "代謝": ["糖尿病", "脂質異常症", "高尿酸血症・痛風", "栄養・肥満"],
  "腎臓": ["急性腎障害", "慢性腎臓病", "糸球体・ネフローゼ", "水電解質・酸塩基", "透析"],
  "呼吸器": ["呼吸器感染症", "COPD", "気管支喘息", "間質性肺疾患", "肺癌・腫瘍", "胸膜疾患", "肺循環（塞栓・肺高血圧）"],
  "血液": ["貧血", "白血病・骨髄腫瘍", "悪性リンパ腫", "多発性骨髄腫", "出血・凝固異常"],
  "神経": ["脳血管障害", "認知症", "パーキンソン・変性", "てんかん", "免疫性・脱髄", "末梢神経・筋", "頭痛・機能性"],
  "アレルギー": ["アナフィラキシー・薬物", "蕁麻疹・血管性浮腫", "好酸球性疾患"],
  "膠原病": ["関節リウマチ", "SLE", "血管炎", "全身性硬化症・筋炎", "その他自己免疫"],
  "感染症": ["呼吸器感染", "尿路・性感染", "消化管・腹腔内感染", "血流感染・敗血症", "中枢神経感染", "骨・軟部・皮膚感染"],
  "救急": ["ショック", "心肺停止・蘇生", "意識障害", "急性中毒", "外傷・熱傷・環境"]
};
var PROVINCES = (function(){
  var out = [];
  ORGAN_FIELDS.forEach(function(sys){
    (PROVINCE_SRC[sys] || []).forEach(function(name){ out.push({ id:sys + "/" + name, name:name, sys:sys }); });
  });
  return out;
})();
function provincesOf(sys){ return PROVINCES.filter(function(p){ return p.sys === sys; }); }
function provinceById(id){ for (var i = 0; i < PROVINCES.length; i++) if (PROVINCES[i].id === id) return PROVINCES[i]; return null; }
// Match free text (the AI's 疾患群 line, or a stored id) to a province id,
// preferring one whose system matches the hint. "" = unmatched (a system-level
// "その他" learning). A stored id that no longer exists degrades to "".
function canonProvince(raw, sysHint){
  var v = String(raw == null ? "" : raw).trim();
  if (!v) return "";
  if (provinceById(v)) return v;
  var hit = "";
  for (var i = 0; i < PROVINCES.length; i++) {
    var p = PROVINCES[i];
    if (v.indexOf(p.name) === -1 && p.name.indexOf(v) === -1) continue;
    if (sysHint && p.sys === sysHint) return p.id;
    if (!hit) hit = p.id;
  }
  return hit;
}
function learnProvinceFromText(text, sysHint){
  var m = String(text || "").match(/^\s*疾患群[:：]\s*(.+)$/m);
  return m ? canonProvince(m[1], sysHint) : "";
}
// Rank grows with overall conquest %. Returns an index 0..6 (STR.learnRankN).
function learnRank(pct){
  var t = [0, 10, 25, 45, 65, 85, 100], r = 0;
  for (var i = 0; i < t.length; i++) if (pct >= t[i]) r = i;
  return r;
}

// Flatten every case's aiLogs into learning items, newest first.
function collectLearnings(cases){
  var out = [];
  cloneArr(cases).forEach(function(c){
    if (!c || !c.aiLogs) return;
    var label = typeof c.label === "string" ? c.label : "";
    cloneArr(c.aiLogs).forEach(function(x){
      if (!x || !x.id || typeof x.text !== "string" || !x.text) return;
      var field = canonOrganField(x.field);
      var province = canonProvince(x.province, field);
      if (province) { var pp = provinceById(province); if (pp) field = pp.sys; } // province implies its continent
      out.push({
        caseId:c.id, caseLabel:label, id:x.id, text:x.text, date:x.date || "",
        field:field, province:province, domain:canonPfDomain(x.domain),
        mastered:x.mastered === true, reviewCount:isFinite(x.reviewCount) ? x.reviewCount : 0,
        lastReviewedOn:typeof x.lastReviewedOn === "string" ? x.lastReviewedOn : ""
      });
    });
  });
  out.sort(function(a, b){
    if (a.date !== b.date) return a.date < b.date ? 1 : -1;
    return a.id < b.id ? 1 : -1;
  });
  return out;
}

// Per-domain state on one map: fog (no learnings) / frontier (some unmastered) /
// controlled (>=1 and all mastered). Uncategorised items belong to no domain.
function learnMapState(items, mapKey){
  var isField = mapKey === "field";
  var names = isField ? ORGAN_FIELDS : PF_DOMAINS;
  var total = {}, mast = {};
  cloneArr(items).forEach(function(it){
    var k = isField ? it.field : it.domain;
    if (isField ? !k : !(k >= 1)) return;
    total[k] = (total[k] || 0) + 1;
    if (it.mastered) mast[k] = (mast[k] || 0) + 1;
  });
  return names.map(function(name, i){
    var key = isField ? name : i + 1;
    var t = total[key] || 0, m = mast[key] || 0;
    return { key:key, name:name, total:t, mastered:m, state:(t === 0 ? "fog" : (m >= t ? "controlled" : "frontier")) };
  });
}

// Hierarchical map #1: continents (13 systems) each holding province tiles.
// A province is fog/frontier/controlled by its own learnings; an unmatched
// learning (no province) lands in a per-continent "その他" tile that is shown
// but never counts toward the fixed denominator. Continent conquest = controlled
// provinces / total provinces (fixed), so "filling the map" is the long game.
function learnConquestMap(items){
  var provTotal = {}, provMast = {}, otherTotal = {}, otherMast = {};
  cloneArr(items).forEach(function(it){
    if (!it.field) return;
    if (it.province) {
      provTotal[it.province] = (provTotal[it.province] || 0) + 1;
      if (it.mastered) provMast[it.province] = (provMast[it.province] || 0) + 1;
    } else {
      otherTotal[it.field] = (otherTotal[it.field] || 0) + 1;
      if (it.mastered) otherMast[it.field] = (otherMast[it.field] || 0) + 1;
    }
  });
  return ORGAN_FIELDS.map(function(sys){
    var provs = provincesOf(sys).map(function(p){
      var t = provTotal[p.id] || 0, m = provMast[p.id] || 0;
      return { id:p.id, name:p.name, total:t, mastered:m, state:(t === 0 ? "fog" : (m >= t ? "controlled" : "frontier")), other:false };
    });
    var ot = otherTotal[sys] || 0;
    if (ot > 0) provs.push({ id:sys + "/その他", name:"その他", total:ot, mastered:otherMast[sys] || 0, state:((otherMast[sys] || 0) >= ot ? "controlled" : "frontier"), other:true });
    var real = provs.filter(function(p){ return !p.other; });
    var controlled = real.filter(function(p){ return p.state === "controlled"; }).length;
    var withLearning = provs.filter(function(p){ return p.total > 0; }).length;
    var state = withLearning === 0 ? "fog" : (real.every(function(p){ return p.total === 0 || p.state === "controlled"; }) && (ot === 0 || (otherMast[sys] || 0) >= ot) ? "controlled" : "frontier");
    return { sys:sys, name:sys, provinces:provs, controlled:controlled, totalProvinces:real.length, withLearning:withLearning, state:state };
  });
}

// current = a streak ending today or yesterday (still alive); longest = best ever.
function learnStreaks(dateList, todayIso){
  var set = {};
  cloneArr(dateList).forEach(function(d){ if (/^\d{4}-\d{2}-\d{2}$/.test(d)) set[d] = true; });
  var uniq = Object.keys(set).sort();
  var longest = 0, run = 0, prev = null;
  uniq.forEach(function(d){
    run = (prev && computeDay(prev, d) === 2) ? run + 1 : 1;
    if (run > longest) longest = run;
    prev = d;
  });
  var current = 0;
  if (uniq.length) {
    var gap = computeDay(uniq[uniq.length - 1], todayIso); // 1 = today, 2 = yesterday
    if (gap === 1 || gap === 2) {
      current = 1;
      for (var i = uniq.length - 2; i >= 0; i--) {
        if (computeDay(uniq[i], uniq[i + 1]) === 2) current++; else break;
      }
    }
  }
  return { current:current, longest:longest };
}

// Unmastered items, least-recently-reviewed first (so a "まだ" sinks it and the
// oldest untouched learnings resurface). Optional cap for the queue view.
function learnReviewQueue(items, limit){
  var pending = cloneArr(items).filter(function(it){ return !it.mastered; });
  pending.sort(function(a, b){
    var la = a.lastReviewedOn || "", lb = b.lastReviewedOn || "";
    if (la !== lb) return la < lb ? -1 : 1;
    if (a.date !== b.date) return a.date < b.date ? -1 : 1;
    return a.id < b.id ? -1 : 1;
  });
  return typeof limit === "number" && limit > 0 ? pending.slice(0, limit) : pending;
}

function learnStats(cases, todayIso){
  var items = collectLearnings(cases);
  var caseSet = {}, masteredCount = 0, dates = [];
  items.forEach(function(it){
    caseSet[it.caseId] = true;
    if (it.mastered) masteredCount++;
    dates.push(it.date);
  });
  var conquest = learnConquestMap(items);
  var domainMap = learnMapState(items, "domain");
  var provControlled = 0, provTotal = 0;
  conquest.forEach(function(c){ provControlled += c.controlled; provTotal += c.totalProvinces; });
  var domainControlled = domainMap.filter(function(d){ return d.state === "controlled"; }).length;
  var conquestPct = provTotal ? Math.round(provControlled / provTotal * 100) : 0;
  var s = learnStreaks(dates, todayIso);
  return {
    total:items.length, caseCount:Object.keys(caseSet).length, masteredCount:masteredCount,
    conquest:conquest, domainMap:domainMap,
    provControlled:provControlled, provTotal:provTotal, conquestPct:conquestPct, rank:learnRank(conquestPct),
    domainControlled:domainControlled, domainTotal:domainMap.length,
    currentStreak:s.current, longestStreak:s.longest, items:items
  };
}

// Milestone tiers per metric -> earned tier + next target (badges row).
var LEARN_TIERS = { total:[10, 25, 50, 100], cases:[5, 15, 30], streak:[3, 7, 14], controlled:[1, 5, 10, 20, 40] };
function learnBadges(stats){
  var value = { total:stats.total, cases:stats.caseCount, streak:stats.longestStreak, controlled:stats.provControlled + stats.domainControlled };
  return Object.keys(LEARN_TIERS).map(function(metric){
    var v = value[metric], earned = 0, next = null;
    LEARN_TIERS[metric].forEach(function(n){ if (v >= n) earned = n; else if (next === null) next = n; });
    return { metric:metric, value:v, earned:earned, next:next };
  });
}

// Top-level screens are a registry, same idea as CALC_TOOLS: this list is the
// only place that knows which tabs exist and in what order. The chip row, the
// body dispatch (TAB_BODY) and the on-enter hooks (TAB_ENTER) all read from it,
// so adding a screen is a data change plus one render function.
//   scratch:true  = entering the tab throws away the previous session's inputs
//
// 2026-07-30 (CEO): 今日／週間予定 were retired from the tab row — they were
// barely used, and clover-pages (opened many times a day) was three taps deep
// behind the calculator list. The two views' code and logic stay in the file
// unreachable, so restoring either is a one-line change here.
var VIEW_TABS = [
  { id:"board",  labelKey:"boardView" },
  { id:"calc",   labelKey:"scoreView", scratch:true },
  { id:"clover", labelKey:"cloverView" },
  { id:"learn",  labelKey:"learnView" }
];

function viewTabById(id){
  for (var i = 0; i < VIEW_TABS.length; i++) if (VIEW_TABS[i].id === id) return VIEW_TABS[i];
  return null;
}

// An unknown tab id (older device, dropped tab, corrupted state) falls back to
// the board rather than rendering nothing.
function normalizeViewTab(id){
  return viewTabById(String(id || "")) ? String(id) : VIEW_TABS[0].id;
}

// ---- nudges (2026-07-31, Phase 2) -----------------------------------------
// Footprints give the course "what happened". The one thing they cannot give is
// "why" — and asking for it is where every previous attempt died (夕の棚卸し,
// 種: both required the user to start). So the app starts instead, and only
// ever as a mark on the card. Nothing interrupts, nothing is due, everything is
// skippable, and one case shows at most ONE open question at a time.
var NUDGE_DEFAULTS = { staleDays:3, reaskDays:3, taskStallDays:3 };

function normalizeNudgeCfg(raw){
  var src = isObj(raw) ? raw : {};
  var out = {};
  Object.keys(NUDGE_DEFAULTS).forEach(function(k){
    var n = Math.floor(toNum(src[k], NUDGE_DEFAULTS[k]));
    // 0 would mean "ask again the same day", which is nagging. 1 is the floor.
    out[k] = n >= 1 && n <= 30 ? n : NUDGE_DEFAULTS[k];
  });
  return out;
}

function daysBetween(fromIso, toIso){
  var a = Date.parse(String(fromIso || "") + "T00:00:00Z");
  var b = Date.parse(String(toIso || "") + "T00:00:00Z");
  if (!Number.isFinite(a) || !Number.isFinite(b)) return 0;
  return Math.round((b - a) / 86400000);
}

// key -> the answer/skip already recorded for it.
function nudgeAnswers(c){
  var map = {};
  cloneArr(c && c.qLogs).forEach(function(q){ if (q && q.key) map[q.key] = q; });
  return map;
}

// The single open question for this case, or null. Priority runs from the most
// information-rich moment down: a result landing and a turn in the course are
// worth more than "nothing has moved".
function pendingNudge(c, todayIso, cfg){
  if (!c || c.status === "discharged") return null;
  var conf = normalizeNudgeCfg(cfg);
  var answered = nudgeAnswers(c);
  var candidates = [];
  var stageLog = cloneArr(c.stageLog);
  var last = stageLog[stageLog.length - 1];
  // A turn in the course: the phase moved today or recently and nobody said why.
  if (stageLog.length > 1 && last && last.date <= todayIso) {
    candidates.push({ key:"stageChanged:" + last.date, trigger:"stageChanged", subject:last.stageId });
  }
  // A wait came back: the moment the plan either changes or is confirmed.
  cloneArr(c.pendings).forEach(function(p){
    if (p && p.closedOn) candidates.push({ key:"waitClosed:" + p.id, trigger:"waitClosed", subject:p.text });
  });
  // The phase has not been touched for a while. The CEO updates it "気づいた
  // ときだけ", so forgetting is the norm — that is the app's job to cover.
  if (last && daysBetween(last.date, todayIso) >= conf.staleDays) {
    candidates.push({ key:"stageStale:" + last.date + ":" + todayIso, trigger:"stageStale", subject:last.stageId });
  }
  // Nothing has moved: either the patient is parked, or something is stuck.
  var lastMove = "";
  cloneArr(c.todos).forEach(function(t){ if (t && t.doneOn && t.doneOn > lastMove) lastMove = t.doneOn; });
  cloneArr(c.pendings).forEach(function(p){ if (p && p.closedOn && p.closedOn > lastMove) lastMove = p.closedOn; });
  if (!lastMove) lastMove = c.admittedAt;
  if (daysBetween(lastMove, todayIso) >= conf.taskStallDays) {
    candidates.push({ key:"taskStalled:" + lastMove + ":" + todayIso, trigger:"taskStalled", subject:lastMove });
  }
  for (var i = 0; i < candidates.length; i++) {
    var prev = answered[candidates[i].key];
    if (!prev) return candidates[i];
    // Skipping is not "no". It parks the question for a few days; answering
    // retires it for good.
    if (prev.skipped && daysBetween(prev.date, todayIso) >= conf.reaskDays) return candidates[i];
  }
  return null;
}

// Trashed entry kind -> the case mirror it is restored into. Adding a new entry
// kind means adding a row here as well, or restore silently does nothing (see
// restoreTrash, and the test that walks every kind). "chartItem" is deliberately
// absent: it lives under c.chart.items and is handled separately.
var TRASH_RESTORE_MIRRORS = {
  next:"next", todo:"todos", pending:"pendings", seed:"seeds",
  problem:"problems", note:"notes", ai:"aiLogs", calc:"calcLogs", ref:"refLogs",
  q:"qLogs"
};

// ---- course timeline (2026-07-31) -----------------------------------------
// The problem this solves, in the CEO's words: "退院した後にその患者のカードを
// 見ても、入院中の経過がわからない。タスク欄がもっとも使用するのに、タスク完了
// 後にそれを見直す方法がなく刹那的な情報となっている."
//
// So it invents nothing and asks for nothing. It is a projection of footprints
// the ward round already leaves: ticking a Task, a wait coming back, changing
// the phase, scoring the patient, opening a reference. stageLog in particular
// has been stored since day one and had never been drawn anywhere.
//
// Items finished before doneOn/closedOn existed carry no date. They are dropped
// rather than guessed onto a day — a made-up date in a clinical course is worse
// than a gap — and courseHasUndated lets the UI say so.
// "why" sits directly under the phase change it explains — that pairing is the
// whole point of the nudges.
var COURSE_RANK = { admit:0, stage:1, why:2, taskDone:3, waitOpen:4, waitClose:5, calc:6, ref:7, note:8, discharge:9 };

// stageName maps a stageId to its display name; the caller owns the stage
// registry, so this stays free of UI state and is unit-testable.
function courseRows(c, stageName){
  var rows = [];
  var nameOf = typeof stageName === "function" ? stageName : function(id){ return String(id || ""); };
  function push(date, kind, text){
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(date || ""))) return;
    rows.push({ date:date, kind:kind, text:String(text || "") });
  }
  push(c && c.admittedAt, "admit", (c && c.label) || "");
  cloneArr(c && c.stageLog).forEach(function(item){
    if (item) push(item.date, "stage", nameOf(item.stageId));
  });
  cloneArr(c && c.todos).forEach(function(item){
    if (item && item.done && item.doneOn) push(item.doneOn, "taskDone", item.text);
  });
  cloneArr(c && c.pendings).forEach(function(item){
    if (!item) return;
    push(item.openedOn, "waitOpen", item.text);
    if (item.closedOn) push(item.closedOn, "waitClose", item.text);
  });
  cloneArr(c && c.calcLogs).forEach(function(item){ if (item) push(item.date, "calc", item.text); });
  cloneArr(c && c.refLogs).forEach(function(item){ if (item) push(item.date, "ref", item.text); });
  cloneArr(c && c.notes).forEach(function(item){ if (item) push(item.date, "note", item.text); });
  // Answered nudges. A skip leaves no row: the course records what the ward
  // round produced, not which questions were declined.
  cloneArr(c && c.qLogs).forEach(function(item){
    if (item && !item.skipped && item.text) push(item.date, "why", item.text);
  });
  if (c && c.dischargedAt) push(c.dischargedAt, "discharge", "");
  // Chronological: a course is read forwards. Ties break on a fixed kind order
  // then on text, so identical data always draws in an identical order — no
  // jitter between devices, and the ordering is assertable in a test.
  rows.sort(function(a, b){
    if (a.date !== b.date) return a.date < b.date ? -1 : 1;
    var ra = COURSE_RANK[a.kind] || 0, rb = COURSE_RANK[b.kind] || 0;
    if (ra !== rb) return ra - rb;
    return String(a.text).localeCompare(String(b.text));
  });
  return rows;
}

// True when the case holds items finished before this feature existed, so the
// panel can explain the gap instead of looking lossy.
function courseHasUndated(c){
  return cloneArr(c && c.todos).some(function(x){ return x && x.done && !x.doneOn; });
}

function todayISO(){
  var d = new Date();
  var y = d.getFullYear();
  var m = String(d.getMonth() + 1).padStart(2, "0");
  var day = String(d.getDate()).padStart(2, "0");
  return y + "-" + m + "-" + day;
}

function nowISO(){
  return new Date().toISOString();
}

function uid(){

function debounce(fn, wait){
  var t = 0;
  return function(){
    var args = arguments;
    clearTimeout(t);
    t = setTimeout(function(){ fn.apply(null, args); }, wait);
  };
}

function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function compactSex(sex){
  return sex === "M" ? STR.sexM : sex === "F" ? STR.sexF : "";
}

function compactMeta(c){
  var demo = (c.ageBand || "") + compactSex(c.sex);
  return [c.room, demo].filter(Boolean).join(" ");
}

function isoWeekday(date){
  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(date || ""))) return 0;
  var y = Number(String(date).slice(0, 4));
  var m = Number(String(date).slice(5, 7));
  var d = Number(String(date).slice(8, 10));
  return new Date(y, m - 1, d).getDay();
}

function weekHeaderLabel(date){
  var day = isoWeekday(date);
  return Number(date.slice(5, 7)) + "/" + Number(date.slice(8, 10)) + "(" + STR.weekdays[day] + ")";
}

function weekHeaderClass(date, today){
  var cls = [];
  var day = isoWeekday(date);
  if (date === today) cls.push("todaycol");
  if (day === 0) cls.push("suncol");
  if (day === 6) cls.push("satcol");
  return cls.join(" ");
}

function defaultSettings(){

    cardHidden:[],
    chartHidden:[]

function normalizeCardSections(sections){
  var defaults = defaultSettings().cardSections;
  var seen = {};
  var ordered = cloneArr(sections).filter(function(name){
    if (!defaults.includes(name) || seen[name]) return false;
    seen[name] = true;
    return true;
  });
  defaults.forEach(function(name){
    if (!seen[name]) ordered.push(name);
  });
  return ordered;
}

  var src = null;

  var base = defaultSettings();
  if (!isObj(src)) return base;
  base.cardSections = normalizeCardSections(cloneArr(src.cardSections).filter(Boolean));
  base.cardHidden = cloneArr(src.cardHidden).filter(Boolean);
  base.chartHidden = cloneArr(src.chartHidden).filter(Boolean);
  // density (compact/normal, dropped 2026-07-22): a stored value is ignored and
  // no longer written back, so old settings blobs need no migration.
  return base;
}

function pushTrashEntry(type, caseRow, payload){
  DB.trash = cloneArr(DB.trash);
  DB.trash.push({
    id:uid(),
    deletedAt:nowISO(),
    type:type,
    caseId:caseRow && caseRow.id || "",
    caseLabel:caseRow && caseRow.label || "",
    payload:JSON.parse(JSON.stringify(payload || {}))
  });
}

function trashTypeLabel(type){
  if (type === "case") return "\u75c7\u4f8b";
  if (type === "next") return DB.config.labels.task;
  if (type === "todo") return DB.config.labels.task;
  if (type === "pending") return DB.config.labels.pending;
  if (type === "seed") return DB.config.labels.seeds;
  if (type === "problem") return STR.problemsLabel;
  if (type === "note") return STR.notesLabel;
  if (type === "ai") return STR.aiPanel;
  if (type === "calc") return STR.calcLogPanel;
  if (type === "ref") return STR.refLogPanel;
  if (type === "chartItem") return STR.chartPanel;
  return type;
}

function trashItemLabel(entry){
  var payload = entry && entry.payload || {};
  if (!entry) return "";
  if (entry.type === "case") return entry.caseLabel || payload.label || "";
  if (entry.type === "chartItem") return payload.name || "";
  return payload.text || "";
}

function removeTrashEntry(trashId){
  DB.trash = cloneArr(DB.trash).filter(function(entry){ return entry.id !== trashId; });
}

function restoreTrash(trashId){
  var entry = cloneArr(DB.trash).find(function(row){ return row.id === trashId; });
  if (!entry) return;
  var stamp = nowISO();
  if (entry.type === "case") {
    // Keep the payload's own lastTouchedAt: the baseline stamp after the sync
    // reset must reflect how old this snapshot really is, or restoring stale
    // trash would overwrite the other device's newer edits field by field.
    var restored = normalizeCase(entry.payload, stamp, todayISO());
    DB.cases = cloneArr(DB.cases).filter(function(c){ return c.id !== restored.id; });
    DB.cases.push(restored);
    if (SYNC && SYNC.state) {
      syncMarkRestored(SYNC.state, restored.id);
      saveSync();
    }
    removeTrashEntry(entry.id);
    saveState();
    render();
    syncAfterSave();
    return;
  }
  var restoredSub = false;
  mutateCase(entry.caseId, function(c){
    // One row per trashable kind. A kind missing from this table used to fall
    // through the if/else chain silently: the item was dropped from the trash
    // and never restored (QA P1-2, 2026-07-31). Now an unhandled kind leaves the
    // trash untouched and says so, so the failure is loud and recoverable.
    var mirror = TRASH_RESTORE_MIRRORS[entry.type] || "";
    if (mirror) {
      if (!Array.isArray(c[mirror])) c[mirror] = [];
      c[mirror].push(JSON.parse(JSON.stringify(entry.payload)));
    } else if (entry.type === "chartItem") {
      c.chart = normalizeChart(c.chart);
      c.chart.items.push(JSON.parse(JSON.stringify(entry.payload)));
    } else {
      return; // unknown kind: keep it in the trash rather than lose it
    }
    removeTrashEntry(entry.id);
    restoredSub = true;
  });
  if (!restoredSub && typeof alert === "function") alert(STR.restoreMissingCase);
}

function loadThemeMode(){
  var raw = null;
  try { raw = localStorage.getItem(THEME_KEY); } catch (e) {}
  return raw === "light" || raw === "dark" ? raw : "os";
}

function resolveTheme(){
  if (THEME_MODE === "light" || THEME_MODE === "dark") return THEME_MODE;
  try {
    if (typeof matchMedia === "function" && matchMedia("(prefers-color-scheme: dark)").matches) return "dark";
  } catch (e) {}
  return "light";
}

function applyTheme(){
  var theme = resolveTheme();
  if (typeof document !== "undefined" && document.documentElement && document.documentElement.setAttribute) {
    document.documentElement.setAttribute("data-theme", theme);
  }
  var meta = typeof document !== "undefined" && document.querySelector ? document.querySelector('meta[name="theme-color"]') : null;
  // Status bar follows the topbar, not the page background (CEO 2026-07-29),
  // so the brand navy runs unbroken from the system bar into the app header.
  if (meta && meta.setAttribute) meta.setAttribute("content", "#0e3252");
}

function setThemeMode(mode){
  THEME_MODE = mode === "light" || mode === "dark" ? mode : "os";
  try { localStorage.setItem(THEME_KEY, THEME_MODE); } catch (e) {}
  applyTheme();
  renderSheet();
}

  return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}

function syncStatusLabel(){

    case "off": return "未設定（ローカルのみ）";
    case "syncing": return "同期中…";
    case "ok": return "同期済み " + at;
    case "offline": return "オフライン（ローカル保存は正常）" + (at ? " ・前回 " + at : "");
    case "reauth": return "再ログインが必要";
    case "error": return "同期エラー" + (at ? " ・前回 " + at : "");
    default: return at ? "前回 " + at : "待機中";
  }
}
